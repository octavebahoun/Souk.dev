# Front statique : les fichiers existent tels quels, sinon c'est le routeur React.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Réseaux mobiles lents : HTML, JS, CSS, SVG et JSON partent compressés (4 à 5 fois moins lourds).
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml application/manifest+json;

    # Les fichiers versionnés par Vite (assets/) se gardent un an ; le reste (index.html
    # surtout) se revérifie à chaque visite, sinon les navigateurs rateraient un déploiement.
    # nginx n'hérite pas des add_header d'un niveau à l'autre : la CSP (écrite au build par
    # scripts/csp-nginx.mjs) est incluse dans chaque bloc. HSTS, nosniff et le refus d'être
    # affiché dans un cadre viennent de Traefik (infra/proxy/plateforme.yml.dist).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/csp.conf;
        # Un fichier versionné absent est une vraie 404, pas la page de l'appli.
        try_files $uri =404;
    }

    # Fichiers cachés (.env, .git…) : jamais servis, jamais confondus avec une page.
    # /.well-known/ reste ouvert (security.txt).
    location ~ /\.(?!well-known/) {
        return 404;
    }

    # Adresses de fichiers que le site n'a pas (sondes de scanners, anciens liens) : une vraie
    # 404 plutôt que la page de l'appli en 200.
    location ~* \.(php|asp|aspx|jsp|cgi|sql|bak|zip|tar|gz|log|ini|yml|yaml|map)$ {
        try_files $uri =404;
    }

    location = /robots.txt {
        expires 1h;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        expires 1h;
        try_files $uri =404;
    }

    location /images/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        expires -1;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/csp.conf;
        try_files $uri $uri/ /index.html;
    }
}
