# Front statique : les fichiers existent tels quels, sinon c'est le routeur React.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Les fichiers versionnés par Vite (assets/) se gardent un an ; le reste (index.html
    # surtout) se revérifie à chaque visite, sinon les navigateurs rateraient un déploiement.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        expires -1;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
