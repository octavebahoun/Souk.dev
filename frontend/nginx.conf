# Front statique : les fichiers existent tels quels, sinon c'est le routeur React.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Les fichiers versionnés par Vite (assets/) se gardent un an ; le reste (index.html
    # surtout) se revérifie à chaque visite, sinon les navigateurs rateraient un déploiement.
    # nginx n'hérite pas des add_header d'un niveau à l'autre : la CSP (écrite au build par
    # scripts/csp-nginx.mjs) est incluse dans chaque bloc. HSTS, nosniff et le refus d'être
    # affiché dans un cadre viennent de Traefik (infra/proxy/plateforme.yml.dist).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/csp.conf;
    }

    location / {
        expires -1;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/csp.conf;
        try_files $uri $uri/ /index.html;
    }
}
