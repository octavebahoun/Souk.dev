openapi: 3.1.0
info:
  title: Souk.dev API
  version: 0.1.0
  description: |
    Contrat d'API du MVP Souk.dev.
    Source unique des types : le front génère ses types avec openapi-typescript,
    le back vérifie ses réponses dans les tests.

    Authentification (Sanctum, SPA) : appeler d'abord GET /sanctum/csrf-cookie,
    puis renvoyer l'en-tête X-XSRF-TOKEN (valeur du cookie XSRF-TOKEN) à chaque
    requête POST, PATCH ou DELETE. Jeton absent ou expiré : 419.

    Limites de débit (au-delà : 429) : 3 déploiements par heure et par compte,
    10 discussions, correctifs ou missions par heure, 3 analyses Souk AI par jour,
    60 requêtes par minute pour le reste.

    Les routes marquées « web » (connexion, CSRF, broadcasting) sont servies à la
    racine du domaine, hors du préfixe /api.

servers:
  - url: /api

tags:
  - name: Comptes
  - name: Applis
  - name: Déploiements
  - name: Discussions
  - name: Correctifs
  - name: Missions
  - name: Événements
  - name: Paiements
  - name: Revenus
  - name: Notifications
  - name: Administration

security:
  - session: []

paths:

  # ───────────── Comptes ─────────────
  /sanctum/csrf-cookie:
    servers: [{ url: / }]
    get:
      tags: [Comptes]
      operationId: csrfCookie
      summary: Web. Initialise la protection CSRF (pose le cookie XSRF-TOKEN)
      security: []
      responses:
        '204':
          description: Cookie XSRF-TOKEN posé

  /auth/github:
    get:
      tags: [Comptes]
      operationId: githubRedirect
      summary: 'Web. Redirige vers GitHub (dépôts publics uniquement, jamais la permission repo). Connecté : lie GitHub au compte existant.'
      security: []
      responses:
        '302':
          description: Redirection vers GitHub

      parameters:
        - name: profil
          in: query
          description: Choix d'entrée, utilisé à la création du compte pour la redirection
          schema: { type: string, enum: [dev, client], default: dev }
    servers: &id001 [url: /]

  /auth/github/callback:
    get:
      tags: [Comptes]
      operationId: githubCallback
      summary: Retour de GitHub, ouvre la session
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
      responses:
        '302':
          description: Session ouverte, redirection vers le front

    servers: *id001

  /auth/lien-magique:
    servers: [{ url: / }]
    post:
      tags: [Comptes]
      operationId: demanderLienMagique
      summary: Web. Envoie un lien de connexion par email (clients sans GitHub)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LienMagiqueDemande' }
      responses:
        '202':
          description: Email envoyé si l'adresse est valide (même réponse que le compte existe ou non)
        '419': { $ref: '#/components/responses/CsrfInvalide' }
        '422': { $ref: '#/components/responses/Invalide' }
        '429': { $ref: '#/components/responses/TropDeRequetes' }

  /auth/lien-magique/{token}:
    servers: [{ url: / }]
    get:
      tags: [Comptes]
      operationId: utiliserLienMagique
      summary: Web. Lien reçu par email, à usage unique et limité dans le temps ; ouvre la session
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '302':
          description: Session ouverte, redirection vers le front (Store pour un client)
        '410':
          description: Lien expiré ou déjà utilisé

  /auth/demo:
    servers: [{ url: / }]
    post:
      tags: [Comptes]
      operationId: connexionDemo
      summary: "Web. Développement et tests de bout en bout seulement (DEMO_CONNEXION=true, jamais en production) : ouvre la session d'un compte du jeu de démo"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [compte]
              properties:
                compte: { type: string, description: "Identifiant d'un compte de démo, ex. soukdemo-awa" }
      responses:
        '204':
          description: Session ouverte
        '404':
          description: Connexion de démo désactivée, ou compte inconnu ou hors du jeu de démo
        '419': { $ref: '#/components/responses/CsrfInvalide' }
        '422': { $ref: '#/components/responses/Invalide' }

  /logout:
    post:
      tags: [Comptes]
      operationId: logout
      summary: Web. Ferme la session
      responses:
        '204':
          description: Déconnecté

        '419': { $ref: '#/components/responses/CsrfInvalide' }
    servers: *id001

  /broadcasting/auth:
    servers: [{ url: / }]
    post:
      tags: [Comptes]
      operationId: broadcastingAuth
      summary: Web. Autorise l'écoute d'un canal privé Reverb (appelé par Laravel Echo)
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [socket_id, channel_name]
              properties:
                socket_id: { type: string }
                channel_name: { type: string, description: 'ex. private-deploiement.12' }
      responses:
        '200':
          description: Signature d'autorisation pour le canal
          content:
            application/json:
              schema:
                type: object
                required: [auth]
                properties:
                  auth: { type: string }
        '403': { $ref: '#/components/responses/Interdit' }

  /me:
    get:
      tags: [Comptes]
      operationId: getMe
      summary: Mon compte
      responses:
        '200':
          description: Mon compte
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Compte' }
        '401': { $ref: '#/components/responses/NonConnecte' }
    patch:
      tags: [Comptes]
      operationId: updateMe
      summary: Modifier mon profil (pays, bio, compétences, spécialités, disponibilité) ; seuls les champs envoyés sont modifiés
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompteModification' }
      responses:
        '200':
          description: Profil modifié
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Compte' }
        '401': { $ref: '#/components/responses/NonConnecte' }
        '422': { $ref: '#/components/responses/Invalide' }
        '419': { $ref: '#/components/responses/CsrfInvalide' }

  /me/tableau-de-bord:
    get:
      tags: [Comptes]
      operationId: getDashboard
      summary: Mon tableau de bord de dev (vues, copies actives, revenus réels encaissés, par appli et au total)
      responses:
        '200':
          description: Le tableau de bord
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TableauDeBord' }
        '401': { $ref: '#/components/responses/NonConnecte' }

  /devs:
    get:
      tags: [Comptes]
      operationId: listDevs
      summary: Chercher un dev (espace entreprises), du meilleur Souk Score au plus faible
      security: []
      parameters:
        - name: disponible
          in: query
          description: Uniquement les devs disponibles pour du freelance ou une collaboration
          schema: { type: boolean }
        - name: competence
          in: query
          schema: { $ref: '#/components/schemas/Techno' }
        - name: specialite
          in: query
          schema: { $ref: '#/components/schemas/Specialite' }
        - name: pays
          in: query
          schema: { $ref: '#/components/schemas/Pays' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/ParPage'
      responses:
        '200':
          description: Liste des devs, triée par Souk Score décroissant
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagination'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/DevResume' }

  /devs/{username}:
    get:
      tags: [Comptes]
      operationId: getDev
      summary: Profil public (dépôts, étoiles, README)
      security: []
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Profil public
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfilDev' }
        '404': { $ref: '#/components/responses/Introuvable' }

  /devs/{username}/missions:
    post:
      tags: [Missions]
      operationId: createMissionDev
      summary: Recruter un dev directement, sans passer par une appli (mission privée, app_id vide)
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MissionCreation' }
      responses:
        '201':
          description: Demande envoyée au dev
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Mission' }
        '401': { $ref: '#/components/responses/NonConnecte' }
        '404': { $ref: '#/components/responses/Introuvable' }
        '422': { $ref: '#/components/responses/Invalide' }
        '429': { $ref: '#/components/responses/TropDeRequetes' }
        '419': { $ref: '#/components/responses/CsrfInvalide' }

  # ───────────── Applis ─────────────
  /apps:
    get:
      tags: [Applis]
      operationId: listApps
      summary: Le store
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/ParPage'
        - name: q
          in: query
          description: Recherche dans le nom et la description
          schema: { type: string, maxLength: 100 }
        - name: gratuit
          in: query
          description: true = uniquement les applis gratuites
          schema: { type: boolean }
        - name: techno
          in: query
          description: Uniquement les applis dont la stack contient cette techno
          schema: { $ref: '#/components/schemas/Techno' }
        - name: securite
          in: query
          description: true = uniquement les applis au badge « Security Checked » (statut verifie)
          schema: { type: boolean }
        - name: categorie
          in: query
          schema: { $ref: '#/components/schemas/Categorie' }
        - name: pays
          in: query
          description: Pays de l'auteur
          schema: { $ref: '#/components/schemas/Pays' }
        - name: prix_max
          in: query
          description: Prix maximum en FCFA (les applis gratuites sont incluses)
          schema: { type: integer, minimum: 0 }
        - name: type_prix
          in: query
          schema: { $ref: '#/components/schemas/TypePrix' }
        - name: tri
          in: query
          description: Par défaut, les plus récentes d'abord
          schema: { type: string, enum: [recent, prix_croissant, prix_decroissant, note], default: recent, description: "note : les mieux notées par leurs clients d'abord" }
      responses:
        '200':
          description: Liste des applis
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagination'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/App' }
    post:
      tags: [Applis]
      operationId: createApp
      summary: Publier une appli (GitHub lié obligatoire ; soukdev.json validé immédiatement avec soukdev.schema.json ; captures envoyées dans le même formulaire ; refusée en 422 si un secret ou un docker-compose.yml dangereux est trouvé ; l'analyse des dépendances démarre ensuite)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/AppCreation' }
            encoding:
              captures: { contentType: 'image/png, image/jpeg, image/webp' }
      responses:
        '201':
          description: Appli publiée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/App' }
        '401': { $ref: '#/components/responses/NonConnecte' }
        '422': { $ref: '#/components/responses/Invalide' }
        '403': { description: 'GitHub non lié au compte (obligatoire pour publier)', content: { application/json: { schema: { $ref: '#/components/schemas/Erreur' } } } }
        '419': { $ref: '#/components/responses/CsrfInvalide' }

  /apps/verification:
    post:
      tags: [Applis]
      operationId: verifyAppRepo
      summary: Vérifier un dépôt avant de publier (dépôt public, docker-compose.yml, soukdev.json validé, aucun secret, docker-compose.yml sans réglage dangereux) ; ne publie rien
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [depot_url]
              properties:
                depot_url: { type: string, format: uri }
      responses:
        '200':
          description: Dépôt valide ; ce que la plateforme a lu dans soukdev.json
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationDepot' }
        '401': { $ref: '#/components/responses/NonConnecte' }
        '403': { description: 'GitHub non lié au compte', content: { application/json: { schema: { $ref: '#/components/schemas/Erreur' } } } }
        '422': { $ref: '#/components/responses/Invalide' }
        '429': { $ref: '#/components/responses/TropDeRequetes' }
        '419': { $ref: '#/components/responses/CsrfInvalide' }

  /apps/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Applis]
      operationId: getApp
      summary: Détail d'une appli (README, démo, prix, auteur) ; compte une vue par visiteur et par jour pour le tableau de bord de l'auteur
      security: []
      responses:
        '200':
          description: L'appli
          content:
            application/json:
              schema: { $ref: '#/components/schemas/App' }
        '404': { $ref: '#/components/responses/Introuvable' }
    patch:
      tags: [Applis]
      operationId: updateApp
      summary: Modifier une appli (auteur uniquement)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppModification' }
      responses:
        '200':
          description: Appli modifiée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/App' }
        '403': { $ref: '#/components/responses/Interdit' }
        '404': { $ref: '#/components/responses/Introuvable' }
        '422': { $ref: '#/components/responses/Invalide' }
        '419': { $ref: '#/components/responses/CsrfInvalide' }
    delete:
      tags: [Applis]
      operationId: deleteApp
      summary: Retirer une appli (auteur uniquement)
      responses:
        '204':
          description: Appli retirée
        '403': { $ref: '#/components/responses/Interdit' }
        '404': { $ref: '#/components/responses/Introuvable' }
        '419': { $ref: '#/components/responses/CsrfInvalide' }

  /apps/{id}/captures:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Applis]
      operationId: replaceAppCaptures
      summary: Remplacer toutes les captures d'une appli (auteur uniquement ; POST car PHP ne lit pas le multipart en PATCH)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [captures]
              properties:
                captures: { $ref: '#/components/schemas/CapturesEnvoi' }
            encoding:
              captures: { contentType: 'image/png, image/jpeg, image/webp' }
      responses:
        '200':
          description: Captures remplacées
          content:
            application/json:
              schema: { $ref: '#/components/schemas/App' }
        '403': { $ref: '#/components/responses/Interdit' }
        '404': { $ref: '#/components/responses/Introuvable' }
        '422': { $ref: '#/components/responses/Invalide' }
        '419': { $ref: '#/components/responses/CsrfInvalide' }

  /apps/{id}/securite:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Applis]
      operationId: rescanAppSecurity
      summary: Relancer l'analyse de sécurité (auteur uniquement), par exemple après avoir corrigé une dépendance
      responses:
        '202':
          description: Analyse mise en file ; le statut passe à en_cours
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Securite' }
        '403': { $ref: '#/components/responses/Interdit' }
        '404': { $ref: '#/components/responses/Introuvable' }
        '429': { $ref: '#/components/responses/TropDeRequetes' }
        '419': { $ref: '#/components/responses/CsrfInvalide' }

  /apps/{id}/avis:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Applis]
      operationId: listAvisAppli
      summary: Avis des clients sur une appli (publics), les plus récents d'abord ; avec la session, ce que le compte connecté peut faire
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/ParPage'
      responses:
        '200':
          description: Avis
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagination'
                  - type: object
                    required: [data, peut_noter, mon_avis]
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/AvisAppli' } }
                      peut_noter: { type: boolean, description: "Le compte connecté a eu une copie payée de l'appli et ne l'a pas encore notée" }
                      mon_avis: { oneOf: [{ $ref: '#/components/schemas/AvisAppli' }, { type: 'null' }] }
        '404': { $ref: '#/components/responses/Introuvable' }
    post:
      tags: [Applis]
      operationId: noterAppli
      summary: "Noter une appli, de 1 à 5 : seulement un client qui en a eu une copie payée, un avis par client et par appli"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AvisAppliSaisie' }
      responses:
        '201':
          description: Avis publié
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvisAppli' }
        '401': { $ref: '#/components/responses/NonConnecte' }
        '403': { $ref: '#/components/responses/Interdit' }
        '404': { $ref: '#/components/responses/Introuvable' }
        '409': { $ref: '#/components/responses/Conflit' }
        '419': { $ref: '#/components/responses/CsrfInvalide' }
        '422': { $ref: '#/components/responses/Invalide' }
        '429': { $ref: '#/components/responses/TropDeRequetes' }
    patch:
      tags: [Applis]
      operationId: modifierAvisAppli
      summary: Modifier son propre avis sur l'appli
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AvisAppliSaisie' }
      responses:
        '200':
          description: Avis modifié
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvisAppli' }
        '401': { $ref: '#/components/responses/NonConnecte' }
        '404': { $ref: '#/components/responses/Introuvable' }
        '419': { $ref: '#/components/responses/CsrfInvalide' }
        '422': { $ref: '#/components/responses/Invalide' }
        '429': { $ref: '#/components/responses/TropDeRequetes' }

  /categories:
    get:
      tags: [Applis]
      operationId: listCategories
      summary: Liste fixe des catégories d'appli (type de projet)
      security: []
      responses:
        '200':
          description: Les catégories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Categorie' }

  /technos:
    get:
      tags: [Applis]
      operationId: listTechnos
      summary: Liste fixe des technos (stack d'une appli, filtre du store)
      security: []
      responses:
        '200':
          description: Les technos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Techno' }

  # ───────────── Déploiements ─────────────
  /apps/{id}/deployments:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Déploiements]
      operationId: createDeployment
      summary: "Commander une copie : crée l'abonnement et sa première facture (hébergement du mois, plus le prix de l'appli). La copie reste en attente_paiement et ne démarre qu'une fois la facture payée (POST /factures/{id}/paiement)."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeploiementCreation' }
      responses:
        '202':
          description: Copie commandée, en attente du paiement de facture_a_payer ; les changements d'état arrivent par Reverb
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deploiement' }
        '401': { $ref: '#/components/responses/NonConnecte' }
        '404': { $ref: '#/components/responses/Introuvable' }
        '422': { $ref: '#/components/responses/Invalide' }
        '429': { $ref: '#/components/responses/TropDeRequetes' }
        '419': { $ref: '#/components/responses/CsrfInvalide' }

  /deployments:
    get:
      tags: [Déploiements]
      operationId: listDeployments
      summary: Mes déploiements (écran « mes copies » avec ?type=client)
      parameters:
        - name: type
          in: query
          description: Uniquement ce type de copie ; client pour l'écran « mes copies »
          schema: { type: string, enum: [client, test, correctif] }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/ParPage'
      responses:
        '200':
          description: Liste de mes déploiements
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagination'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Deploiement' }
        '401': { $ref: '#/components/responses/NonConnecte' }

  /deployments/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Déploiements]
      operationId: getDeployment
      summary: État et URL d'un déploiement
      responses:
        '200':
          description: Le déploiement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deploiement' }
        '403': { $ref: '#/components/responses/Interdit' }
        '404': { $ref: '#/components/responses/Introuvable' }
    delete:
      tags: [Déploiements]
      operationId: deleteDeployment
      summary: Arrêter un déploiement
      description: >-
        L'arrêt tourne en arrière-plan sur le moteur : l'état passe à arret_en_cours, puis à arrete
        (conteneurs, volumes et dossier supprimés), diffusé par Reverb. Si Docker refuse deux fois,
        le déploiement passe en echec avec son message et l'arrêt est retenté par le nettoyage planifié.
        Déjà arrêté ou en cours d'arrêt : rien ne change.
      responses:
        '202':
          description: Arrêt demandé ; le déploiement tel qu'il est maintenant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deploiement' }
        '403': { $ref: '#/components/responses/Interdit' }
        '404': { $ref: '#/components/responses/Introuvable' }
        '419': { $ref: '#/components/responses/CsrfInvalide' }

  # ───────────── Discussions ─────────────
  /discussions:
    get:
      tags: [Discussions]
      operationId: listDiscussions
