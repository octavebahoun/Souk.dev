        '404': { $ref: '#/components/responses/Introuvable' }

  /factures/{id}/paiement:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Paiements]
      operationId: payerFacture
      summary: "Ouvrir une session de paiement SasPay pour la facture (Mobile Money ou carte). Le montant vient de la facture, jamais du navigateur ; les frais de paiement s'ajoutent (ADD_ON). Rediriger le client vers checkout_url."
      parameters:
        - $ref: '#/components/parameters/CleIdempotence'
      responses:
        '428': { $ref: '#/components/responses/CleIdempotenceManquante' }
        '201':
          description: Session ouverte
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionPaiement' }
        '401': { $ref: '#/components/responses/NonConnecte' }
        '404': { $ref: '#/components/responses/Introuvable' }
        '409': { $ref: '#/components/responses/Conflit' }
        '419': { $ref: '#/components/responses/CsrfInvalide' }
        '429': { $ref: '#/components/responses/TropDeRequetes' }
        '503':
          description: Le prestataire de paiement est indisponible ; réessayer dans quelques minutes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erreur' }

  /factures/{id}/verification:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Paiements]
      operationId: verifierFacture
      summary: "Revérifier tout de suite auprès de SasPay le dernier paiement de la facture (page de retour de paiement). Si SasPay confirme SUCCESS, la facture passe payee et la copie démarre (ou reprend)."
      responses:
        '200':
          description: La facture, à jour
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Facture' }
        '401': { $ref: '#/components/responses/NonConnecte' }
        '404': { $ref: '#/components/responses/Introuvable' }
        '419': { $ref: '#/components/responses/CsrfInvalide' }
        '429': { $ref: '#/components/responses/TropDeRequetes' }

  /paiement/facture/{id}:
    servers: [{ url: / }]
    get:
      tags: [Paiements]
      operationId: lienPaiementFacture
      summary: "Web. Lien de paiement signé, envoyé par e-mail (rappel avant échéance) : ouvre une session SasPay et redirige vers sa page, sans connexion. Facture déjà payée : redirection vers « Mes paiements »."
      security: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: signature
          in: query
          required: true
          schema: { type: string }
        - name: expires
          in: query
          required: true
          schema: { type: integer }
      responses:
        '302':
          description: Redirection vers la page de paiement SasPay, ou vers le front
        '403':
          description: Lien invalide ou expiré
        '404': { $ref: '#/components/responses/Introuvable' }

  /webhooks/saspay:
    post:
      tags: [Paiements]
      operationId: webhookSasPay
      summary: "Événements SasPay (transaction.success, transaction.failed…). Signature X-Webhook-Signature (HMAC SHA-256 de « {timestamp}.{corps brut} ») vérifiée, horodatage de plus de 300 secondes refusé. Traitement idempotent qui revérifie toujours l'état par l'API SasPay avant de changer quoi que ce soit."
      security: []
      parameters:
        - name: X-Webhook-Signature
          in: header
          required: true
          schema: { type: string }
        - name: X-Webhook-Timestamp
          in: header
          required: true
          schema: { type: integer }
        - name: X-Webhook-Event
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event, data]
              properties:
                event: { type: string }
                data: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Événement reçu (traité en arrière-plan)
        '400':
          description: Corps illisible
        '401':
          description: Signature invalide ou horodatage hors tolérance

  /simulateur/saspay/{session}:
    servers: [{ url: / }]
    parameters:
      - name: session
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Paiements]
      operationId: pageSimulateurSasPay
      summary: "Web. Développement et tests seulement (passerelle simulée, jamais en production) : page de paiement qui imite celle de SasPay."
      security: []
      responses:
        '200':
          description: Page HTML du simulateur
        '404':
          description: Simulateur désactivé ou session inconnue
    post:
      tags: [Paiements]
      operationId: choisirSimulateurSasPay
      summary: "Web. Développement et tests seulement : issue du paiement simulé (succes, echec ou attente) ; envoie un vrai webhook signé, puis renvoie vers return_url après un succès."
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [issue]
              properties:
                issue: { type: string, enum: [succes, echec, attente] }
                reseau: { type: string, description: 'Code réseau choisi, ex. mtn_bj' }
      responses:
        '200':
          description: Page de résultat (échec ou attente)
        '302':
          description: Paiement réussi, retour vers return_url
        '404':
          description: Simulateur désactivé ou session inconnue
        '419': { $ref: '#/components/responses/CsrfInvalide' }

  # ───────────── Revenus ─────────────
  /me/revenus:
    get:
      tags: [Revenus]
      operationId: getRevenus
      summary: "Mes revenus de dev : solde dû (parts encaissées moins reversements), totaux, reversement en cours, coordonnées Mobile Money"
      responses:
        '200':
          description: Mes revenus
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Revenus' }
        '401': { $ref: '#/components/responses/NonConnecte' }

  /me/revenus/mouvements:
    get:
      tags: [Revenus]
      operationId: listMouvements
      summary: Mouvements de mon solde (parts encaissées, reversements, corrections), les plus récents d'abord
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/ParPage'
      responses:
        '200':
          description: Mouvements
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagination'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Mouvement' }
        '401': { $ref: '#/components/responses/NonConnecte' }

  /me/revenus/reversements:
    get:
      tags: [Revenus]
      operationId: listReversements
      summary: Mes reversements, les plus récents d'abord
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/ParPage'
      responses:
        '200':
          description: Reversements
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagination'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Reversement' }
        '401': { $ref: '#/components/responses/NonConnecte' }
    post:
      tags: [Revenus]
      operationId: demanderReversement
      summary: "Demander le reversement de tout mon solde sur mon Mobile Money (5 000 F au moins, coordonnées confirmées, un seul reversement en cours). Sans demande, le solde est reversé chaque mois. Les frais sont pris sur la marge de Souk.dev, jamais sur le solde."
      parameters:
        - $ref: '#/components/parameters/CleIdempotence'
      responses:
        '428': { $ref: '#/components/responses/CleIdempotenceManquante' }
        '202':
          description: Reversement initié ; son état se suit dans la liste
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reversement' }
        '401': { $ref: '#/components/responses/NonConnecte' }
        '409': { $ref: '#/components/responses/Conflit' }
        '419': { $ref: '#/components/responses/CsrfInvalide' }
        '422': { $ref: '#/components/responses/Invalide' }
        '429': { $ref: '#/components/responses/TropDeRequetes' }

  /me/notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      summary: Centre de notifications du compte, les plus récentes d'abord, avec le nombre de non lues
      parameters:
        - name: filtre
          in: query
          schema: { type: string, enum: [toutes, non_lues], default: toutes }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/ParPage'
      responses:
        '200':
          description: Notifications
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagination'
                  - type: object
                    required: [data, non_lues]
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Notification' } }
                      non_lues: { type: integer, description: Nombre total de notifications non lues }
        '401': { $ref: '#/components/responses/NonConnecte' }
        '422': { $ref: '#/components/responses/Invalide' }

  /me/notifications/lecture:
    post:
      tags: [Notifications]
      operationId: lireToutesNotifications
      summary: Tout marquer comme lu
      responses:
        '204': { description: Toutes les notifications sont lues }
        '401': { $ref: '#/components/responses/NonConnecte' }
        '419': { $ref: '#/components/responses/CsrfInvalide' }

  /me/notifications/{notification}/lecture:
    parameters:
      - name: notification
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Notifications]
      operationId: lireNotification
      summary: Marquer une notification comme lue (celle d'un autre compte répond 404)
      responses:
        '200':
          description: Notification lue
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notification' }
        '401': { $ref: '#/components/responses/NonConnecte' }
        '404': { $ref: '#/components/responses/Introuvable' }
        '419': { $ref: '#/components/responses/CsrfInvalide' }

  /me/preferences-notifications:
    get:
      tags: [Notifications]
      operationId: lirePreferencesNotifications
      summary: Réglages par type, dans Souk.dev et par e-mail
      responses:
        '200':
          description: Réglages
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreferencesNotifications' }
        '401': { $ref: '#/components/responses/NonConnecte' }
    put:
      tags: [Notifications]
      operationId: modifierPreferencesNotifications
      summary: "Changer les réglages ; un type absent garde les siens, un e-mail obligatoire reste envoyé"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PreferencesNotificationsSaisie' }
      responses:
        '200':
          description: Réglages enregistrés
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreferencesNotifications' }
        '401': { $ref: '#/components/responses/NonConnecte' }
        '419': { $ref: '#/components/responses/CsrfInvalide' }
        '422': { $ref: '#/components/responses/Invalide' }

  /me/coordonnees-reversement:
    get:
      tags: [Revenus]
      operationId: getCoordonneesReversement
      summary: Mes coordonnées Mobile Money de reversement (numéro masqué)
      responses:
        '200':
          description: Coordonnées, ou null si aucune n'est saisie
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/CoordonneesReversement'
                  - type: 'null'
        '401': { $ref: '#/components/responses/NonConnecte' }
    put:
      tags: [Revenus]
      operationId: enregistrerCoordonneesReversement
      summary: "Saisir ou changer mes coordonnées Mobile Money (numéro saisi deux fois). Elles ne servent qu'après confirmation par le lien envoyé à mon adresse e-mail."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CoordonneesReversementSaisie' }
      responses:
        '200':
          description: Coordonnées enregistrées, en attente de confirmation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CoordonneesReversement' }
        '401': { $ref: '#/components/responses/NonConnecte' }
        '419': { $ref: '#/components/responses/CsrfInvalide' }
        '422': { $ref: '#/components/responses/Invalide' }
        '429': { $ref: '#/components/responses/TropDeRequetes' }

  /reversement/confirmer/{token}:
    servers: [{ url: / }]
    parameters:
      - name: token
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Revenus]
      operationId: afficherConfirmationReversement
      summary: "Web. Lien reçu par e-mail : page qui montre le numéro masqué et un bouton de confirmation (un analyseur de liens qui ouvre la page ne confirme rien)"
      security: []
      responses:
        '200':
          description: Page HTML de confirmation
        '302':
          description: Lien expiré ou déjà utilisé, redirection vers « Mes revenus »
    post:
      tags: [Revenus]
      operationId: confirmerCoordonneesReversement
      summary: Web. Bouton de la page de confirmation (jeton CSRF de la session) ; confirme le numéro puis redirige vers « Mes revenus »
      security: []
      responses:
        '302':
          description: Coordonnées confirmées (ou lien expiré), redirection vers le front
        '419':
          description: Jeton CSRF absent ou expiré

  /copie-suspendue:
    servers: [{ url: / }]
    get:
      tags: [Paiements]
      operationId: pageCopieSuspendue
      summary: "Web. Page servie par Traefik sur le sous-domaine d'une copie suspendue pour impayé (neutre : rien sur la facture)"
      security: []
      responses:
        '503':
          description: Page HTML « service momentanément indisponible », avec Retry-After

  /reseaux-mobile-money:
    get:
      tags: [Revenus]
      operationId: listReseauxMobileMoney
      summary: Réseaux Mobile Money acceptés pour un reversement, par pays
      security: []
      responses:
        '200':
          description: Les réseaux
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ReseauMobileMoney' }

  # ───────────── Administration (finances) ─────────────
  /admin/finances:
    get:
      tags: [Administration]
      operationId: getFinancesAdmin
      summary: Vue financière (admin) sur une période, tirée du grand livre
      parameters:
        - name: debut
          in: query
          schema: { type: string, format: date }
        - name: fin
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Finances
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Finances' }
        '401': { $ref: '#/components/responses/NonConnecte' }
        '403': { $ref: '#/components/responses/Interdit' }

  /admin/factures:
    get:
      tags: [Administration]
      operationId: listFacturesAdmin
      summary: Toutes les factures (admin), filtrables par statut
      parameters:
        - name: statut
          in: query
          schema: { $ref: '#/components/schemas/StatutFacture' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/ParPage'
      responses:
        '200':
          description: Factures
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagination'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Facture' }
        '401': { $ref: '#/components/responses/NonConnecte' }
        '403': { $ref: '#/components/responses/Interdit' }

  /admin/factures/{id}/avoir:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Administration]
      operationId: creerAvoir
      summary: "Saisir un avoir (admin) après un remboursement fait depuis le tableau de bord SasPay (SasPay n'a pas d'API de remboursement). Le grand livre reçoit des écritures inverses ; rien n'est modifié."
      parameters:
        - $ref: '#/components/parameters/CleIdempotence'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AvoirCreation' }
      responses:
        '428': { $ref: '#/components/responses/CleIdempotenceManquante' }
        '201':
          description: Avoir enregistré
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Avoir' }
        '401': { $ref: '#/components/responses/NonConnecte' }
        '403': { $ref: '#/components/responses/Interdit' }
        '404': { $ref: '#/components/responses/Introuvable' }
        '409': { $ref: '#/components/responses/Conflit' }
        '419': { $ref: '#/components/responses/CsrfInvalide' }
        '422': { $ref: '#/components/responses/Invalide' }

  /admin/paiements/{id}/remboursement:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Administration]
      operationId: rembourserTropPercu
      summary: "Noter le remboursement d'un paiement en double (admin), fait depuis le tableau de bord SasPay : le grand livre solde le trop-perçu dû au client. Seulement pour un paiement encore à rembourser."
      parameters:
        - $ref: '#/components/parameters/CleIdempotence'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motif]
              properties:
                motif: { type: string, maxLength: 500, description: "ex. « remboursé par SasPay le 26 octobre, référence … »" }
      responses:
        '428': { $ref: '#/components/responses/CleIdempotenceManquante' }
        '201':
          description: Remboursement noté
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TropPercu' }
        '401': { $ref: '#/components/responses/NonConnecte' }
        '403': { $ref: '#/components/responses/Interdit' }
        '404': { $ref: '#/components/responses/Introuvable' }
        '409': { $ref: '#/components/responses/Conflit' }
        '419': { $ref: '#/components/responses/CsrfInvalide' }
        '422': { $ref: '#/components/responses/Invalide' }

  /admin/reversements:
    get:
      tags: [Administration]
      operationId: listReversementsAdmin
      summary: Tous les reversements (admin)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/ParPage'
      responses:
        '200':
          description: Reversements
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagination'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ReversementAdmin' }
        '401': { $ref: '#/components/responses/NonConnecte' }
        '403': { $ref: '#/components/responses/Interdit' }

  /admin/rapprochements:
    get:
      tags: [Administration]
      operationId: listRapprochements
      summary: Rapprochements quotidiens avec les transactions SasPay et leurs écarts (admin)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/ParPage'
      responses:
        '200':
          description: Rapprochements
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagination'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Rapprochement' }
        '401': { $ref: '#/components/responses/NonConnecte' }
        '403': { $ref: '#/components/responses/Interdit' }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: soukdev_session
      description: 'Session Laravel Sanctum (SPA), cookie fixé par SESSION_COOKIE. Requêtes POST, PATCH et DELETE : en-tête X-XSRF-TOKEN obligatoire.'

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer }

    Page:
      name: page
      in: query
      description: Numéro de page (commence à 1)
      schema: { type: integer, minimum: 1, default: 1 }

    CleIdempotence:
      name: Idempotency-Key
      in: header
      required: true
      description: "Identifiant unique de l'intention (un UUID). Rejouée avec la même clé, la requête renvoie la réponse d'origine au lieu de recommencer."
      schema: { type: string, maxLength: 100 }

    ParPage:
      name: per_page
      in: query
      description: Éléments par page (50 maximum)
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }

  responses:
    CleIdempotenceManquante:
      description: "L'en-tête Idempotency-Key est obligatoire : cette opération déplace de l'argent"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erreur' }
    NonConnecte:
      description: Non connecté
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erreur' }

    Interdit:
      description: Action non autorisée
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erreur' }

    Introuvable:
      description: Ressource introuvable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erreur' }

    Invalide:
      description: Données invalides (ex. soukdev.json invalide)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErreurValidation' }

    Conflit:
      description: Doublon ou état incompatible (ex. deuxième avis, deuxième inscription, correctif déjà accepté)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erreur' }

    CsrfInvalide:
      description: Jeton CSRF absent ou expiré (appeler GET /sanctum/csrf-cookie)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erreur' }

    TropDeRequetes:
      description: Limite de débit atteinte
      headers:
        Retry-After:
          description: Secondes à attendre avant de réessayer
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erreur' }

  schemas:
    Erreur:
      type: object
      required: [message]
      properties:
        message: { type: string }

    ErreurValidation:
      type: object
      required: [message, errors]
      properties:
        message: { type: string }
        errors:
          type: object
          description: Erreurs par champ (format de validation Laravel)
          additionalProperties:
            type: array
            items: { type: string }

    Pagination:
      type: object
      description: Format de pagination des API Resources Laravel ; la liste est dans data
      required: [links, meta]
      properties:
        links:
          type: object
          required: [first, last, prev, next]
          properties:
            first: { type: [string, 'null'], format: uri }
            last: { type: [string, 'null'], format: uri }
            prev: { type: [string, 'null'], format: uri }
            next: { type: [string, 'null'], format: uri }
        meta:
          type: object
          required: [current_page, last_page, per_page, total]
          properties:
            current_page: { type: integer }
            last_page: { type: integer }
            per_page: { type: integer }
            total: { type: integer }

    # ───────────── Comptes ─────────────
    Dev:
      type: object
      description: Un compte tel qu'il apparaît publiquement (auteur, participant, client d'une mission…)
      required: [id, nom, username, avatar_url, github_url, profil, pays]
      properties:
        id: { type: integer }
        nom: { type: [string, 'null'] }
        pays:
          description: Facultatif ; null tant que la personne ne l'a pas choisi
          oneOf:
            - $ref: '#/components/schemas/Pays'
            - type: 'null'
        username: { type: [string, 'null'], description: 'Identifiant GitHub ; null si GitHub non lié' }
        avatar_url: { type: [string, 'null'], format: uri-reference, description: "Adresse absolue (avatar GitHub) ou chemin servi par l'API (/storage/…)" }
        github_url: { type: [string, 'null'], format: uri }
        profil:
          type: string
          enum: [dev, client]
          description: Choix d'entrée, sert à la redirection ; pas une étiquette définitive

    Pays:
      type: string
      pattern: '^[A-Z]{2}$'
      description: 'Code pays ISO 3166-1 alpha-2, ex. BJ (Bénin), SN (Sénégal), CI (Côte d''Ivoire). Tous les pays sont acceptés.'

    CompteModification:
      type: object
      description: Tous les champs sont optionnels ; null efface la valeur
      properties:
        pays:
          oneOf:
            - $ref: '#/components/schemas/Pays'
            - type: 'null'
        bio: { type: [string, 'null'], maxLength: 500 }
        competences:
          type: array
          maxItems: 10
          uniqueItems: true
          items: { $ref: '#/components/schemas/Techno' }
        specialites:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/Specialite' }
        disponible: { type: boolean }

    Compte:
      description: Mon compte (GET /me)
      allOf:
        - $ref: '#/components/schemas/Dev'
        - $ref: '#/components/schemas/ProfilPublic'
        - type: object
          required: [email, github_lie, est_admin]
          properties:
            email: { type: [string, 'null'], format: email }
            github_lie: { type: boolean, description: Obligatoire pour publier une appli ou proposer un correctif }
            est_admin: { type: boolean }

    LienMagiqueDemande:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }

    ProfilPublic:
      type: object
      description: Partie publique du profil ; déclarée par le dev (PATCH /me), sauf stats, calculées par la plateforme
      required: [bio, competences, specialites, disponible, stats, reputation, souk_score]
      properties:
        bio: { type: [string, 'null'] }
        competences:
          type: array
          maxItems: 10
          uniqueItems: true
          items: { $ref: '#/components/schemas/Techno' }
        specialites:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/Specialite' }
        disponible: { type: boolean, description: Disponible pour du freelance ou une collaboration }
        stats: { $ref: '#/components/schemas/StatsDev' }
        reputation: { $ref: '#/components/schemas/Reputation' }
        souk_score: { $ref: '#/components/schemas/SoukScore' }

    Specialite:
      type: string
      enum: [frontend, backend, mobile, devops, securite, data]

    TableauDeBord:
      type: object
      description: "Revenus réels, tirés du grand livre (parts du dev sur les factures payées). Le profil (stats, réputation, Souk Score) se lit avec GET /me ; le solde et les reversements avec GET /me/revenus."
      required: [totaux, applis]
      properties:
        totaux:
          type: object
          required: [vues, copies_actives, revenus_mois, revenus_total]
          properties:
            vues: { type: integer }
            copies_actives: { type: integer }
            revenus_mois: { type: integer, description: "FCFA encaissés ce mois-ci pour le dev, toutes applis" }
            revenus_total: { type: integer, description: "FCFA encaissés pour le dev depuis le début" }
        applis:
          type: array
          items: { $ref: '#/components/schemas/StatsApp' }

    StatsApp:
      type: object
      required: [app_id, nom, type_prix, prix, vues, copies_actives, deploiements_total, revenu_mois, revenu_total]
      properties:
        app_id: { type: integer }
        nom: { type: string }
        type_prix: { $ref: '#/components/schemas/TypePrix' }
        prix: { type: integer }
        vues: { type: integer, description: "Visiteurs uniques par jour, cumulés" }
        copies_actives: { type: integer, description: Copies clients en ligne en ce moment }
        deploiements_total: { type: integer, description: Copies clients lancées depuis la publication }
        revenu_mois: { type: integer, description: FCFA encaissés ce mois-ci pour cette appli }
        revenu_total: { type: integer, description: FCFA encaissés pour cette appli depuis la publication }

    SoukScore:
      type: object
      description: "Score sur 1000 qui mesure la qualité et l'activité récente (l'XP, elle, cumule tout depuis l'arrivée). Calculé par la plateforme ; les compétences déclarées ne comptent pas. total = somme des cinq parts."
      required: [total, entraide, projets, clients, securite, activite]
      properties:
        total: { type: integer, minimum: 0, maximum: 1000 }
        entraide: { type: integer, minimum: 0, maximum: 250, description: "25 par bug résolu (correctif accepté), plafonné à 250" }
        projets: { type: integer, minimum: 0, maximum: 200, description: "50 par appli publiée, plafonné à 200" }
        clients: { type: integer, minimum: 0, maximum: 250, description: "note moyenne / 5 × 150 (0 sans note), plus 25 par mission terminée plafonné à 100" }
        securite: { type: integer, minimum: 0, maximum: 150, description: "part des applis du dev au badge Security Checked × 150 (0 sans appli)" }
        activite: { type: integer, minimum: 0, maximum: 150, description: "15 par action validée sur les 30 derniers jours (correctif accepté, appli publiée, mission terminée, événement organisé passé), plafonné à 150" }

    Reputation:
      type: object
      description: "Calculée par la plateforme à partir d'actions validées par quelqu'un d'autre. Barème : correctif accepté +50 ; appli publiée +100, +50 si badge Security Checked ; mission terminée +100 + 10 × la note du client ; événement organisé, une fois passé et non annulé, +50."
      required: [xp, niveau, badges]
      properties:
        xp: { type: integer, minimum: 0 }
        niveau:
          type: string
          enum: [debutant, contributeur, confirme, expert]
          description: debutant dès 0 XP, contributeur dès 200, confirme dès 1 000, expert dès 3 000
        badges:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/Badge' }

    Badge:
      type: string
      enum: [premier_correctif, chasseur_de_bugs, publie, fiable, securise, organisateur]
      description: "premier_correctif : 1 correctif accepté ; chasseur_de_bugs : 10 bugs résolus ; publie : 1 appli publiée ; fiable : note moyenne ≥ 4,5 sur au moins 3 missions ; securise : 1 appli au badge Security Checked ; organisateur : 1 événement organisé et passé"

    StatsDev:
      type: object
      description: Calculées par la plateforme, impossibles à modifier à la main
      required: [bugs_resolus, applis_publiees, missions_terminees, note_moyenne, nb_notes]
      properties:
        bugs_resolus: { type: integer, description: Correctifs de ce dev acceptés par l'auteur d'une discussion }
        applis_publiees: { type: integer }
        missions_terminees: { type: integer }
        note_moyenne: { type: [number, 'null'], minimum: 1, maximum: 5, description: Moyenne des notes laissées par les clients en fin de mission ; null sans aucune note }
        nb_notes: { type: integer }

    ProfilDev:
      description: Profil public d'un dev, avec ses dépôts publics GitHub et ses applis publiées
      allOf:
        - $ref: '#/components/schemas/Dev'
        - $ref: '#/components/schemas/ProfilPublic'
        - type: object
          required: [depots, applis]
          properties:
            depots:
              type: array
              items: { $ref: '#/components/schemas/Depot' }
            applis:
              type: array
              items: { $ref: '#/components/schemas/App' }

    DevResume:
      description: Carte d'un dev dans la recherche (GET /devs), sans ses dépôts ni ses applis
      allOf:
        - $ref: '#/components/schemas/Dev'
        - $ref: '#/components/schemas/ProfilPublic'

    Depot:
      type: object
      description: Dépôt public GitHub du dev
      required: [nom, url, etoiles]
      properties:
        nom: { type: string }
        description: { type: [string, 'null'] }
        url: { type: string, format: uri }
        etoiles: { type: integer }
        langage: { type: [string, 'null'] }
        readme: { type: [string, 'null'], description: README en Markdown }

    # ───────────── Applis ─────────────
    App:
      type: object
      required: [id, nom, description, categorie, prix, type_prix, taille, mesure, demo_url, depot_url, captures, stack, backend, variables_client, securite, auteur, cree_le, note_moyenne, nb_avis]
      properties:
        note_moyenne: { type: [number, 'null'], description: "Moyenne des avis des clients (1 à 5, une décimale) ; null sans avis" }
        nb_avis: { type: integer, description: Nombre d'avis de clients }
        id: { type: integer }
        nom: { type: string }
        description: { type: string }
        readme: { type: [string, 'null'], description: README du dépôt en Markdown }
        categorie: { $ref: '#/components/schemas/Categorie' }
        prix: { type: integer, minimum: 0, description: "Prix de l'appli en FCFA, par mois ou une seule fois selon type_prix ; 0 = gratuit" }
        type_prix: { $ref: '#/components/schemas/TypePrix' }
        taille: { $ref: '#/components/schemas/Taille' }
        mesure: { $ref: '#/components/schemas/MesureMemoire' }
        demo_url: { type: string, format: uri }
        depot_url: { type: string, format: uri }
        captures:
          type: array
          description: "Captures d'écran ; la première sert de couverture sur la carte du store (au moins une à la publication, voir CapturesEnvoi)"
          maxItems: 5
          items: { $ref: '#/components/schemas/Capture' }
        stack:
          type: array
          minItems: 1
          maxItems: 8
          uniqueItems: true
          items: { $ref: '#/components/schemas/Techno' }
        backend:
          type: string
          enum: [propre, integre]
          description: Type de backend déclaré dans soukdev.json
        variables_client:
          type: array
          description: Variables que le client remplit au déploiement (déclarées dans soukdev.json)
          items: { $ref: '#/components/schemas/VariableClient' }
        securite: { $ref: '#/components/schemas/Securite' }
        auteur: { $ref: '#/components/schemas/Dev' }
        cree_le: { type: string, format: date-time }

    VariableClient:
      type: object
      required: [nom, libelle, requis]
      properties:
        nom: { type: string, description: 'Nom de la variable, ex. PHARMACIE_NOM' }
        libelle: { type: string, description: 'Texte affiché au client, ex. « Nom de la pharmacie »' }
        requis: { type: boolean }

    AppCreation:
      type: object
      description: Envoyé en multipart/form-data (champs texte + images)
      required: [nom, description, categorie, depot_url, demo_url, prix, type_prix, taille, stack, captures]
      properties:
        nom: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 1000 }
        depot_url: { type: string, format: uri, description: Dépôt GitHub public contenant docker-compose.yml et soukdev.json }
        demo_url: { type: string, format: uri }
        categorie: { $ref: '#/components/schemas/Categorie' }
        prix: { type: integer, minimum: 0 }
        type_prix: { $ref: '#/components/schemas/TypePrix' }
        taille: { $ref: '#/components/schemas/Taille' }
        stack:
          type: array
          minItems: 1
          maxItems: 8
          uniqueItems: true
          items: { $ref: '#/components/schemas/Techno' }
        captures: { $ref: '#/components/schemas/CapturesEnvoi' }

    Categorie:
      type: string
      enum: [commerce, gestion, education, sante, finance, association, restauration, autre]
      description: Type de projet, choisi à la publication ; liste fixe (GET /categories)

    TypePrix:
      type: string
      enum: [mensuel, unique]
      description: "mensuel = le client paie le prix chaque mois ; unique = il le paie une seule fois. L'hébergement reste mensuel dans les deux cas. Ignoré quand prix vaut 0."

    Taille:
      type: string
      enum: [petite, moyenne, grande]
      description: >-
        Formule d'hébergement de chaque copie, choisie par le dev ; elle fixe le prix d'hébergement payé par le client.
        petite = 512 Mo, 0,5 cœur, 3 500 F/mois ; moyenne = 1 Go, 1 cœur, 7 000 F/mois ; grande = 2 Go, 2 cœurs, 13 500 F/mois.
        Le moteur applique ces limites à chaque copie.

    MesureMemoire:
      type: object
      description: >-
        Mémoire réellement consommée par l'appli, mesurée en tâche de fond après la publication (la plateforme la lance quelques minutes).
        La formule recommandée est celle au-dessus du pic mesuré.
      required: [statut, memoire_max_mo, taille_recommandee, mesure_le]
      properties:
        statut:
          type: string
          enum: [en_cours, terminee, echec]
        memoire_max_mo: { type: [integer, 'null'], description: "Pic de mémoire mesuré, en Mo ; null tant que la mesure n'est pas finie" }
        taille_recommandee:
          oneOf:
            - $ref: '#/components/schemas/Taille'
            - type: 'null'
        mesure_le: { type: [string, 'null'], format: date-time }

    Securite:
      type: object
      description: "Analyse des dépendances du dépôt (Trivy). Secrets et docker-compose.yml dangereux bloquent la publication et n'apparaissent donc jamais ici."
      required: [statut, analyse_le, problemes]
      properties:
        statut:
          type: string
          enum: [en_cours, verifie, problemes]
          description: "verifie = badge vert « Security Checked » ; problemes = badge orange « Problèmes détectés »"
        analyse_le: { type: [string, 'null'], format: date-time, description: null tant que la première analyse n'est pas finie }
        problemes:
          type: array
          items: { $ref: '#/components/schemas/ProblemeSecurite' }

    ProblemeSecurite:
      type: object
      description: Une dépendance avec une faille connue
      required: [identifiant, paquet, version, gravite, version_corrigee]
      properties:
        identifiant: { type: string, description: 'Référence publique de la faille, ex. CVE-2024-12345' }
        paquet: { type: string, description: 'ex. laravel/framework' }
        version: { type: string, description: Version utilisée par le dépôt }
        gravite: { type: string, enum: [faible, moyenne, haute, critique] }
        version_corrigee: { type: [string, 'null'], description: "Première version sans la faille, si elle existe" }

    VerificationDepot:
      type: object
      description: "Dépôt valide. En cas d'erreur (dépôt privé ou introuvable, docker-compose.yml absent, soukdev.json invalide, secret trouvé dans le dépôt, docker-compose.yml dangereux : privileged, volumes de l'hôte, network_mode host, ports publiés), réponse 422 avec le détail par champ."
      required: [service_web, backend, variables_client]
      properties:
        service_web:
          type: object
          required: [nom, port]
          properties:
            nom: { type: string }
            port: { type: integer }
        backend: { type: string, enum: [propre, integre] }
        variables_client:
          type: array
          items: { $ref: '#/components/schemas/VariableClient' }

    CapturesEnvoi:
      type: array
      description: 1 à 5 images PNG, JPEG ou WebP, 5 Mo maximum chacune ; la première sert de couverture
      minItems: 1
      maxItems: 5
      items: { type: string, format: binary, contentMediaType: application/octet-stream }

    Capture:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri }

    Techno:
      type: string
      description: Liste fixe ; « autre » pour une techno absente de la liste
      enum: [laravel, symfony, php, node, express, nestjs, nextjs, react, vue, angular, svelte, django, flask, fastapi, spring, dotnet, go, postgresql, mysql, mongodb, redis, autre]

    AppModification:
      type: object
      description: Tous les champs sont optionnels ; seuls ceux envoyés sont modifiés
      properties:
        nom: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 1000 }
        demo_url: { type: string, format: uri }
        categorie: { $ref: '#/components/schemas/Categorie' }
        prix: { type: integer, minimum: 0 }
        type_prix: { $ref: '#/components/schemas/TypePrix' }
        taille:
          description: Ne s'applique qu'aux nouveaux déploiements ; les clients déjà installés gardent leur formule et leur prix
          allOf:
            - $ref: '#/components/schemas/Taille'
        stack:
          type: array
          minItems: 1
          maxItems: 8
          uniqueItems: true
          items: { $ref: '#/components/schemas/Techno' }

    # ───────────── Déploiements ─────────────
    Deploiement:
      type: object
      required: [id, app_id, app_nom, taille, type, etat, url, erreur, cree_le, abonnement, facture_a_payer]
      properties:
        id: { type: integer }
        app_id: { type: [integer, 'null'], description: "null pour une copie de test lancée depuis le depot_url d'une discussion, sans appli publiée" }
        app_nom: { type: string, description: "Nom de l'appli copiée, pour l'afficher sans la recharger ; sans appli, owner/repo du dépôt" }
        taille:
          description: Formule de la copie, figée au déploiement (un changement de taille de l'appli ne la modifie pas)
          allOf:
            - $ref: '#/components/schemas/Taille'
        type:
          type: string
          enum: [client, test, correctif]
          description: Copie d'un client, copie de test d'une discussion, ou version corrigée
        etat:
          type: string
          enum: [attente_paiement, en_file, construction, demarrage, en_ligne, echec, suspendu, arret_en_cours, arrete]
          description: "Copie client : attente_paiement jusqu'au paiement de la première facture. Puis en_file → construction → demarrage → en_ligne ; echec à n'importe quelle étape ; suspendu après 7 jours de facture impayée (réactivée au paiement) ; arret_en_cours puis arrete après DELETE /deployments/{id} ou 30 jours de suspension"
        url:
          type: [string, 'null']
          format: uri
          description: Renseignée quand l'état est en_ligne
        erreur:
          type: [string, 'null']
          description: Message lisible quand l'état est echec
        cree_le: { type: string, format: date-time }
        abonnement:
          description: Facturation de la copie client ; null pour une copie de test ou une version corrigée (gratuites)
          oneOf:
            - $ref: '#/components/schemas/Abonnement'
            - type: 'null'
        facture_a_payer:
          description: La facture à régler pour démarrer ou garder la copie ; null si tout est payé
          oneOf:
            - $ref: '#/components/schemas/FactureResume'
            - type: 'null'

    DeploiementCreation:
      type: object
      required: [variables]
      properties:
        variables:
          type: object
          description: 'Valeurs des variables_client de l''appli, ex. {"PHARMACIE_NOM": "Pharmacie du Port"}'
          additionalProperties: { type: string }

    # ───────────── Discussions ─────────────
    Etiquette:
      type: string
      enum: [bug, question, tuto, projet, entraide]

    Discussion:
      type: object
      required: [id, titre, texte, auteur, canal, app_id, depot_url, demo_url, etiquettes, bug, copie_test, analyse_ia, resolue, nb_messages, cree_le]
      properties:
        id: { type: integer }
        titre: { type: string }
        texte: { type: string, description: Markdown }
        auteur: { $ref: '#/components/schemas/Dev' }
        canal: { type: [string, 'null'], description: Slug du canal }
        app_id: { type: [integer, 'null'], description: Appli jointe }
        depot_url: { type: [string, 'null'], format: uri, description: Dépôt GitHub public joint (même non publié) }
        demo_url: { type: [string, 'null'], format: uri, description: 'Appli déployée ailleurs (ex. Vercel), affichée dans une iframe sandbox' }
        etiquettes: { type: array, items: { $ref: '#/components/schemas/Etiquette' } }
        bug:
          description: Rempli seulement quand la discussion porte l'étiquette bug
          oneOf:
            - $ref: '#/components/schemas/Bug'
            - type: 'null'
        copie_test:
          description: Copie de test, seulement si l'auteur l'a lancée (POST /discussions/{id}/copie-test)
          oneOf:
            - $ref: '#/components/schemas/Deploiement'
            - type: 'null'
        analyse_ia:
          description: Analyse Souk AI, seulement si l'auteur l'a demandée (POST /discussions/{id}/analyse-ia)
          oneOf:
            - $ref: '#/components/schemas/AnalyseIa'
            - type: 'null'
        resolue: { type: boolean, description: "Vraie quand l'auteur accepte un correctif ou la marque résolue lui-même (PATCH)" }
        nb_messages: { type: integer }
        cree_le: { type: string, format: date-time }
      description: Une discussion est soit dans un canal, soit sur la page d'une appli, jamais les deux.

    DiscussionCreation:
      type: object
      description: Il faut soit canal, soit app_id (jamais les deux). depot_url et demo_url sont optionnels et ne lancent aucun déploiement.
      required: [titre, texte]
      properties:
        titre: { type: string, maxLength: 200 }
        texte: { type: string }
        canal: { type: string, description: Slug du canal ; obligatoire sans app_id }
        app_id: { type: integer, description: Appli publiée ; exclut canal }
        depot_url: { type: string, format: uri }
        demo_url: { type: string, format: uri }
        etiquettes:
          type: array
          items: { $ref: '#/components/schemas/Etiquette' }
        bug: { $ref: '#/components/schemas/BugSaisie' }
      oneOf:
        - required: [canal]
          not: { required: [app_id] }
        - required: [app_id]
          not: { required: [canal] }
      if:
        required: [etiquettes]
        properties:
          etiquettes: { contains: { const: bug } }
      then:
        required: [bug]

    DiscussionModification:
      type: object
      description: Tous les champs sont optionnels ; seuls ceux envoyés sont modifiés
      properties:
        titre: { type: string, maxLength: 200 }
        texte: { type: string }
        depot_url: { type: [string, 'null'], format: uri }
        demo_url: { type: [string, 'null'], format: uri }
        etiquettes:
          type: array
          items: { $ref: '#/components/schemas/Etiquette' }
        resolue: { type: boolean, description: "L'auteur la marque résolue (même sans correctif) ou la rouvre" }
        bug: { $ref: '#/components/schemas/BugSaisie' }

    AnalyseIa:
      type: object
      description: >-
        Avis de Souk AI sur un bug, affiché à tous sous « 🤖 Analyse IA », à côté des correctifs.
        C'est une suggestion : elle ne résout jamais la discussion.
      required: [statut, texte, cree_le]
      properties:
        statut:
          type: string
          enum: [en_cours, prete, echec]
          description: echec couvre aussi un refus du modèle ; le front affiche « analyse indisponible »
        texte: { type: [string, 'null'], description: 'Markdown, rempli quand statut = prete' }
        cree_le: { type: string, format: date-time }

    Bug:
      type: object
      description: Fiche structurée d'un bug, remplie par l'auteur de la discussion
      required: [erreur_obtenue, comportement_attendu, techno, code, difficulte]
      properties:
        erreur_obtenue: { type: string, description: 'Ce qui se passe, ex. « le callback renvoie 500 »' }
        comportement_attendu: { type: string, description: 'Ce qui devrait se passer, ex. « la commande passe en payée »' }
        techno:
          oneOf:
            - $ref: '#/components/schemas/Techno'
            - type: 'null'
        code: { type: [string, 'null'], description: Extrait de code concerné (Markdown) }
        difficulte:
          oneOf:
            - $ref: '#/components/schemas/Difficulte'
            - type: 'null'

    BugSaisie:
      type: object
      description: Obligatoire à la création quand etiquettes contient bug
      required: [erreur_obtenue, comportement_attendu]
      properties:
        erreur_obtenue: { type: string, maxLength: 2000 }
        comportement_attendu: { type: string, maxLength: 2000 }
        techno: { $ref: '#/components/schemas/Techno' }
        code: { type: string, maxLength: 10000 }
        difficulte: { $ref: '#/components/schemas/Difficulte' }

    Difficulte:
      type: string
      enum: [facile, moyen, difficile]
      description: Choisie par l'auteur du bug

    Message:
      type: object
      required: [id, texte, auteur, cree_le]
      properties:
        id: { type: integer }
        texte: { type: string, description: Markdown }
        auteur: { $ref: '#/components/schemas/Dev' }
        cree_le: { type: string, format: date-time }

    MessageCreation:
      type: object
      required: [texte]
      properties:
        texte: { type: string }

    Canal:
      type: object
      required: [slug, nom, description, pays]
      properties:
        slug: { type: string, description: 'ex. laravel, mobile-money, laravel-benin' }
        nom: { type: string }
        description: { type: [string, 'null'] }
        pays:
          description: 'Canal d''un pays (ex. #laravel-benin → BJ) ; null pour un canal général ou régional'
          oneOf:
            - $ref: '#/components/schemas/Pays'
            - type: 'null'

    CanalCreation:
      type: object
      required: [nom]
      properties:
        nom: { type: string, maxLength: 50 }
        description: { type: string, maxLength: 300 }
        pays: { $ref: '#/components/schemas/Pays' }

    # ───────────── Correctifs ─────────────
    Correctif:
      type: object
      required: [id, discussion_id, depot_url, demo_url, description, accepte, deploiement, auteur, cree_le]
      properties:
        id: { type: integer }
        discussion_id: { type: integer }
        depot_url: { type: string, format: uri, description: Fork ou branche GitHub }
        demo_url: { type: [string, 'null'], format: uri, description: Version corrigée déployée ailleurs (optionnel) }
        description: { type: [string, 'null'], description: Ce que le correctif change }
        accepte: { type: boolean }
        deploiement: { description: 'Déploiement de la version corrigée, seulement si son auteur l''a lancé', oneOf: [$ref: '#/components/schemas/Deploiement', type: 'null'] }
        auteur: { $ref: '#/components/schemas/Dev' }
        cree_le: { type: string, format: date-time }

    CorrectifCreation:
      type: object
      required: [depot_url]
      properties:
        depot_url: { type: string, format: uri, description: URL d'une branche ou d'un fork GitHub }
        description: { type: string, maxLength: 1000 }
        demo_url: { type: string, format: uri }

    # ───────────── Missions ─────────────
    Mission:
      type: object
      description: "Demande privée d'un client à un dev, visible par eux seuls : personnalisation d'une appli (POST /apps/{id}/missions) ou recrutement direct (POST /devs/{username}/missions)"
      required: [id, app_id, client, auteur, message, budget, delai, statut, note, cree_le]
      properties:
        id: { type: integer }
        app_id: { type: [integer, 'null'], description: Appli à personnaliser ; null pour un recrutement direct }
        statut:
          type: string
          enum: [en_cours, terminee]
          description: Le client la passe à terminee en laissant sa note (POST /missions/{id}/note)
        note:
          description: Note du client à la fin de la mission ; null tant qu'elle n'est pas terminée
          oneOf:
            - $ref: '#/components/schemas/NoteMission'
            - type: 'null'
        client: { $ref: '#/components/schemas/Dev' }
        auteur: { $ref: '#/components/schemas/Dev' }
        message: { type: string, description: Besoin exprimé par le client }
        budget: { type: [integer, 'null'], minimum: 0, description: Budget indicatif en FCFA }
        delai: { type: [string, 'null'], format: date, description: Date souhaitée }
        cree_le: { type: string, format: date-time }

    NoteMission:
      type: object
      required: [note, commentaire]
      properties:
        note: { type: integer, minimum: 1, maximum: 5 }
        commentaire: { type: [string, 'null'] }

    NoteMissionCreation:
      type: object
      required: [note]
      properties:
        note: { type: integer, minimum: 1, maximum: 5 }
        commentaire: { type: string, maxLength: 1000 }

    MissionCreation:
      type: object
      required: [message]
      properties:
        message: { type: string, maxLength: 5000 }
        budget: { type: integer, minimum: 0 }
        delai: { type: string, format: date }

    # ───────────── Paiements ─────────────
    Abonnement:
      type: object
      description: "Facturation d'une copie client, à date anniversaire : l'hébergement chaque mois, plus le prix de l'appli chaque mois (mensuel) ou une seule fois (unique)."
      required: [statut, formule, montant_hebergement, prix_appli, type_prix, prochaine_echeance, suspendu_le]
      properties:
        statut:
          type: string
          enum: [en_attente, actif, en_retard, suspendu, incident, resilie]
          description: "en_attente : première facture pas encore payée ; en_retard : échéance passée, 7 jours de grâce ; suspendu : copie arrêtée, réactivée au paiement ; incident : copie payée qui n'a pas pu démarrer, plus aucune facture tant que l'équipe n'a pas réglé le problème ; resilie : arrêt définitif après 30 jours de suspension"
        formule: { $ref: '#/components/schemas/Taille' }
        montant_hebergement: { type: integer, description: "FCFA par mois, figé à la commande" }
        prix_appli: { type: integer, description: "FCFA, figé à la commande ; 0 pour une appli gratuite" }
        type_prix: { $ref: '#/components/schemas/TypePrix' }
        prochaine_echeance: { type: [string, 'null'], format: date }
        suspendu_le: { type: [string, 'null'], format: date-time }

    StatutFacture:
      type: string
      enum: [a_payer, payee, annulee, remboursee]

    FactureResume:
      type: object
      required: [id, numero, montant_total, echeance_le, statut]
      properties:
        id: { type: integer }
        numero: { type: string, description: 'ex. SD-2026-000123' }
        montant_total: { type: integer, description: "FCFA, hors frais de paiement (ajoutés par SasPay)" }
        echeance_le: { type: string, format: date }
        statut: { $ref: '#/components/schemas/StatutFacture' }

    LigneFacture:
      type: object
      required: [libelle, montant]
      properties:
        libelle: { type: string, description: "ex. « Hébergement, formule moyenne, du 25 octobre au 24 novembre »" }
        montant: { type: integer }

    Facture:
      type: object
      required: [id, numero, deploiement_id, app_nom, periode_debut, periode_fin, emise_le, echeance_le, montant_hebergement, montant_appli, montant_total, montant_rembourse, statut, payee_le, lignes, paiements]
      properties:
        id: { type: integer }
        numero: { type: string }
        deploiement_id: { type: integer }
        app_nom: { type: string }
        periode_debut: { type: string, format: date }
        periode_fin: { type: string, format: date }
        emise_le: { type: string, format: date-time }
        echeance_le: { type: string, format: date }
        montant_hebergement: { type: integer }
        montant_appli: { type: integer }
        montant_total: { type: integer, description: "FCFA, ce que reçoit Souk.dev ; les frais de paiement (ADD_ON) s'ajoutent côté client" }
        montant_rembourse: { type: integer, description: Somme des avoirs }
        statut: { $ref: '#/components/schemas/StatutFacture' }
        payee_le: { type: [string, 'null'], format: date-time }
        lignes:
          type: array
          items: { $ref: '#/components/schemas/LigneFacture' }
        paiements:
          type: array
          description: Tentatives de paiement, la plus récente d'abord
          items: { $ref: '#/components/schemas/Paiement' }

    Paiement:
      type: object
      required: [id, statut, montant, frais_client, montant_debite, reference, cree_le, verifie_le]
      properties:
        id: { type: integer }
        statut:
          type: string
          enum: [en_attente, reussi, echoue, annule]
          description: "Reflet du statut SasPay revérifié par l'API (PENDING, SUCCESS, FAILED ; annule pour une session expirée ou annulée)"
        montant: { type: integer, description: Montant demandé (celui de la facture) }
        frais_client: { type: [integer, 'null'], description: "Frais de paiement ajoutés par SasPay (ADD_ON), connus après vérification" }
        montant_debite: { type: [integer, 'null'], description: Ce qu'a réellement payé le client }
        reference: { type: [string, 'null'], description: Référence SasPay de la transaction }
        cree_le: { type: string, format: date-time }
        verifie_le: { type: [string, 'null'], format: date-time }

    SessionPaiement:
      type: object
      required: [paiement, checkout_url]
      properties:
        paiement: { $ref: '#/components/schemas/Paiement' }
        checkout_url: { type: string, format: uri, description: Page de paiement hébergée par SasPay }

    # ───────────── Revenus ─────────────
    Revenus:
      type: object
      required: [solde, encaisse_total, encaisse_mois, reverse_total, seuil_demande, peut_demander, raison_blocage, reversement_en_cours, prochain_reversement_le, coordonnees]
      properties:
        solde: { type: integer, description: "FCFA dû au dev : ses parts encaissées moins ses reversements (et corrections)" }
        encaisse_total: { type: integer, description: Parts encaissées depuis le début }
        encaisse_mois: { type: integer, description: Parts encaissées ce mois-ci }
        reverse_total: { type: integer }
        seuil_demande: { type: integer, description: Solde minimal pour un reversement à la demande (5 000 F) }
        peut_demander: { type: boolean }
        raison_blocage: { type: [string, 'null'], description: "Pourquoi la demande est impossible (solde trop bas, coordonnées non confirmées, reversement en cours)" }
        reversement_en_cours:
          oneOf:
            - $ref: '#/components/schemas/Reversement'
            - type: 'null'
        prochain_reversement_le: { type: string, format: date, description: Reversement mensuel automatique }
        coordonnees:
          oneOf:
            - $ref: '#/components/schemas/CoordonneesReversement'
            - type: 'null'

    Mouvement:
      type: object
      description: "Une écriture du grand livre sur le compte du dev, vue par lui : positive quand il gagne, négative quand il est payé"
      required: [id, type, montant, libelle, cree_le]
      properties:
        id: { type: integer }
        type:
          type: string
          enum: [encaissement, reversement, reversement_annule, avoir]
        montant: { type: integer }
        libelle: { type: string }
        cree_le: { type: string, format: date-time }

    Reversement:
      type: object
      required: [id, montant, statut, reseau, numero_masque, declenchement, cree_le, verifie_le, erreur]
      properties:
        id: { type: integer }
        montant: { type: integer, description: "Montant reçu par le dev, entier ; les frais sont à la charge de Souk.dev" }
        statut:
          type: string
          enum: [en_attente, reussi, echoue]
        reseau: { type: string, description: 'Code réseau, ex. mtn_bj' }
        numero_masque: { type: string, description: 'ex. +229 01 •• •• 50 50' }
        declenchement:
          type: string
          enum: [mensuel, demande]
        cree_le: { type: string, format: date-time }
        verifie_le: { type: [string, 'null'], format: date-time }
        erreur: { type: [string, 'null'] }

    ReversementAdmin:
      allOf:
        - $ref: '#/components/schemas/Reversement'
        - type: object
          required: [dev, frais]
          properties:
            dev: { $ref: '#/components/schemas/Dev' }
            frais: { type: [integer, 'null'], description: Frais de reversement payés par Souk.dev }

    CoordonneesReversement:
      type: object
      required: [pays, reseau, numero_masque, confirme, confirme_le]
      properties:
        pays: { $ref: '#/components/schemas/Pays' }
        reseau: { type: string }
        numero_masque: { type: string }
        confirme: { type: boolean, description: "Faux tant que le lien envoyé par e-mail n'a pas été ouvert ; aucun reversement avant" }
        confirme_le: { type: [string, 'null'], format: date-time }

    CoordonneesReversementSaisie:
      type: object
      required: [pays, reseau, numero, numero_confirmation]
      properties:
        pays: { $ref: '#/components/schemas/Pays' }
        reseau: { type: string, description: 'Code d''un réseau de GET /reseaux-mobile-money, du même pays' }
        numero: { type: string, maxLength: 20, description: 'Numéro local ou international, ex. 0197505050 ou +2290197505050' }
        numero_confirmation: { type: string, maxLength: 20 }

    ReseauMobileMoney:
      type: object
      required: [code, nom, pays]
      properties:
        code: { type: string, description: 'Code SasPay, ex. mtn_bj' }
        nom: { type: string, description: 'ex. MTN MoMo' }
        pays: { $ref: '#/components/schemas/Pays' }

    # ───────────── Administration (finances) ─────────────
    Finances:
      type: object
      description: "Tiré du grand livre (entiers FCFA). marge = revenus_hebergement − frais (reversements et encaissements) − avoirs côté hébergement."
      required: [debut, fin, encaissements, revenus_hebergement, parts_devs, reversements, frais_reversement, avoirs, marge, solde_devs, solde_saspay_attendu, factures_impayees, copies_suspendues, trop_percus]
      properties:
        debut: { type: string, format: date }
        fin: { type: string, format: date }
        encaissements: { type: integer, description: Montants encaissés sur la période }
        revenus_hebergement: { type: integer }
        parts_devs: { type: integer, description: Parts des devs encaissées sur la période }
        reversements: { type: integer, description: Versé aux devs sur la période }
        frais_reversement: { type: integer }
        avoirs: { type: integer }
        marge: { type: integer }
        solde_devs: { type: integer, description: "Dû aux devs aujourd'hui, tous comptes confondus" }
        solde_saspay_attendu: { type: integer, description: "Ce que le compte SasPay devrait contenir d'après le grand livre" }
        factures_impayees: { type: integer }
        copies_suspendues: { type: integer }
        trop_percus:
          type: array
          description: Paiements en double encore à rembourser aux clients (tous, quelle que soit la période)
          items: { $ref: '#/components/schemas/TropPercu' }

    TropPercu:
      type: object
      description: "Un paiement reçu pour une facture déjà payée ou annulée : l'argent est dû au client"
      required: [paiement_id, facture_id, facture_numero, montant, reference, recu_le, rembourse]
      properties:
        paiement_id: { type: integer }
        facture_id: { type: integer }
        facture_numero: { type: string }
        montant: { type: integer, description: FCFA à rendre au client }
        reference: { type: [string, 'null'], description: Référence SasPay du paiement en double }
        recu_le: { type: string, format: date-time }
        rembourse: { type: boolean }

    TypeNotification:
      type: string
      enum: [correctif_propose, correctif_accepte, message_mission, echeance, suspension, reversement]

    Notification:
      type: object
      description: "Diffusée aussi en direct : événement notification.creee sur le canal privé utilisateur.{id}"
      required: [id, type, titre, texte, lien, lue, cree_le]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/TypeNotification' }
        titre: { type: string }
        texte: { type: string }
        lien: { type: [string, 'null'], description: "Chemin du front vers l'écran concerné (/paiements/12…)" }
        lue: { type: boolean }
        cree_le: { type: string, format: date-time }

    PreferencesNotifications:
      type: object
      required: [types]
      properties:
        types:
          type: array
          items:
            type: object
            required: [type, libelle, description, application, email, email_obligatoire]
            properties:
              type: { $ref: '#/components/schemas/TypeNotification' }
              libelle: { type: string }
              description: { type: string }
              application: { type: boolean, description: Dans le centre de notifications de Souk.dev }
              email: { type: boolean }
              email_obligatoire: { type: boolean, description: "L'e-mail part quoi qu'il arrive (suspension : prévient avant la suppression des données)" }

    PreferencesNotificationsSaisie:
      type: object
      required: [preferences]
      properties:
        preferences:
          type: array
          items:
            type: object
            required: [type, application, email]
            properties:
              type: { $ref: '#/components/schemas/TypeNotification' }
              application: { type: boolean }
              email: { type: boolean }

    AvisAppli:
      type: object
      description: Avis d'un client sur une appli dont il a eu une copie payée
      required: [id, note, commentaire, auteur, cree_le, modifie_le]
      properties:
        id: { type: integer }
        note: { type: integer, minimum: 1, maximum: 5 }
        commentaire: { type: [string, 'null'], maxLength: 1000 }
        auteur: { $ref: '#/components/schemas/Dev' }
        cree_le: { type: string, format: date-time }
        modifie_le: { type: string, format: date-time }

    AvisAppliSaisie:
      type: object
      required: [note]
      properties:
        note: { type: integer, minimum: 1, maximum: 5 }
        commentaire: { type: [string, 'null'], maxLength: 1000 }

    AvoirCreation:
      type: object
      required: [montant_hebergement, montant_appli, motif]
      properties:
        montant_hebergement: { type: integer, minimum: 0 }
        montant_appli: { type: integer, minimum: 0 }
        motif: { type: string, maxLength: 500 }

    Avoir:
      type: object
      required: [id, numero, facture_id, montant_hebergement, montant_appli, montant_total, motif, cree_le]
      properties:
        id: { type: integer }
        numero: { type: string, description: 'ex. AV-2026-000004' }
        facture_id: { type: integer }
        montant_hebergement: { type: integer }
        montant_appli: { type: integer }
        montant_total: { type: integer }
        motif: { type: string }
        cree_le: { type: string, format: date-time }

    Rapprochement:
      type: object
      required: [id, jour, transactions_saspay, paiements_locaux, ecarts, cree_le]
      properties:
        id: { type: integer }
        jour: { type: string, format: date }
        transactions_saspay: { type: integer, description: Transactions entrantes réussies chez SasPay ce jour-là }
        paiements_locaux: { type: integer, description: Paiements réussis enregistrés chez Souk.dev ce jour-là }
        ecarts:
          type: array
          description: "corrige : paiement réussi resté en attente ici (webhook perdu), rattrapé par la vérification ; les autres types demandent un humain (e-mail à l'admin)"
          items:
            type: object
            required: [type, reference, detail]
            properties:
              type: { type: string, enum: [corrige, inconnue_localement, montant_different, absente_chez_saspay, verification_impossible] }
              reference: { type: string, description: "Transaction SasPay, ou paiement n° … chez Souk.dev" }
              detail: { type: string, description: "Ce qui a été constaté, en clair" }
        cree_le: { type: string, format: date-time }

    # ───────────── Événements ─────────────
    Evenement:
      type: object
      required: [id, titre, description, date, type, lieu, lien, organisateur, nb_inscrits, inscrit, note_moyenne]
      properties:
        id: { type: integer }
        titre: { type: string }
        description: { type: string }
        date: { type: string, format: date-time }
        type:
          type: string
          enum: [en_ligne, presentiel]
        lieu: { type: [string, 'null'], description: Renseigné si presentiel }
        lien:
          type: [string, 'null']
          format: uri
          description: Renseigné si en_ligne ; null si le dev connecté n'est pas inscrit
        organisateur: { $ref: '#/components/schemas/Dev' }
        nb_inscrits: { type: integer, description: Public }
        inscrit: { type: boolean, description: 'Le dev connecté est-il inscrit ?' }
        note_moyenne: { type: [number, 'null'], description: null tant qu'il n'y a aucun avis }

    EvenementCreation:
      type: object
      description: lieu est obligatoire si type = presentiel, lien est obligatoire si type = en_ligne
      required: [titre, description, date, type]
      properties:
        titre: { type: string, maxLength: 200 }
        description: { type: string }
        date: { type: string, format: date-time }
        type:
          type: string
          enum: [en_ligne, presentiel]
        lieu: { type: string }
        lien: { type: string, format: uri }

    EvenementModification:
      type: object
      description: Tous les champs sont optionnels ; seuls ceux envoyés sont modifiés
      properties:
        titre: { type: string, maxLength: 200 }
        description: { type: string }
        date: { type: string, format: date-time }
        type:
          type: string
          enum: [en_ligne, presentiel]
        lieu: { type: string }
        lien: { type: string, format: uri }

    Avis:
      type: object
      required: [id, note, commentaire, auteur, cree_le]
      properties:
        id: { type: integer }
        note: { type: integer, minimum: 1, maximum: 5 }
        commentaire: { type: [string, 'null'] }
        auteur: { $ref: '#/components/schemas/Dev' }
        cree_le: { type: string, format: date-time }

    AvisCreation:
      type: object
      required: [note]
      properties:
        note: { type: integer, minimum: 1, maximum: 5 }
        commentaire: { type: string, maxLength: 1000 }
