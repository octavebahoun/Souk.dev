openapi: 3.1.0
info:
  title: Souk.dev API
  version: 0.1.0
  description: |
    Contrat d'API du MVP Souk.dev.
    Source unique des types : le front génère ses types avec openapi-typescript,
    le back vérifie ses réponses dans les tests.

    Authentification (Sanctum, SPA) : appeler d'abord GET /sanctum/csrf-cookie,
    puis renvoyer l'en-tête X-XSRF-TOKEN (valeur du cookie XSRF-TOKEN) à chaque
    requête POST, PATCH ou DELETE. Jeton absent ou expiré : 419.

    Limites de débit (au-delà : 429) : 3 déploiements par heure et par compte,
    10 discussions, correctifs ou missions par heure, 60 requêtes par minute pour le reste.

    Les routes marquées « web » (connexion, CSRF, broadcasting) sont servies à la
    racine du domaine, hors du préfixe /api.

servers:
  - url: /api

tags:
  - name: Comptes
  - name: Applis
  - name: Déploiements
  - name: Discussions
  - name: Correctifs
  - name: Missions
  - name: Événements

security:
  - session: []

paths:

  # ───────────── Comptes ─────────────
  /sanctum/csrf-cookie:
    servers: [{ url: / }]
    get:
      tags: [Comptes]
      operationId: csrfCookie
      summary: Web. Initialise la protection CSRF (pose le cookie XSRF-TOKEN)
      security: []
      responses:
        '204':
          description: Cookie XSRF-TOKEN posé

  /auth/github:
    get:
      tags: [Comptes]
      operationId: githubRedirect
      summary: 'Web. Redirige vers GitHub (dépôts publics uniquement, jamais la permission repo). Connecté : lie GitHub au compte existant.'
      security: []
      responses:
        '302':
          description: Redirection vers GitHub

      parameters:
        - name: profil
          in: query
          description: Choix d'entrée, utilisé à la création du compte pour la redirection
          schema: { type: string, enum: [dev, client], default: dev }
    servers: &id001 [url: /]

  /auth/github/callback:
    get:
      tags: [Comptes]
      operationId: githubCallback
      summary: Retour de GitHub, ouvre la session
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
      responses:
        '302':
          description: Session ouverte, redirection vers le front

    servers: *id001

  /auth/lien-magique:
    servers: [{ url: / }]
    post:
      tags: [Comptes]
      operationId: demanderLienMagique
      summary: Web. Envoie un lien de connexion par email (clients sans GitHub)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LienMagiqueDemande' }
      responses:
        '202':
          description: Email envoyé si l'adresse est valide (même réponse que le compte existe ou non)
        '419': { $ref: '#/components/responses/CsrfInvalide' }
        '422': { $ref: '#/components/responses/Invalide' }
        '429': { $ref: '#/components/responses/TropDeRequetes' }

  /auth/lien-magique/{token}:
    servers: [{ url: / }]
    get:
      tags: [Comptes]
      operationId: utiliserLienMagique
      summary: Web. Lien reçu par email, à usage unique et limité dans le temps ; ouvre la session
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '302':
          description: Session ouverte, redirection vers le front (Store pour un client)
        '410':
          description: Lien expiré ou déjà utilisé

  /logout:
    post:
      tags: [Comptes]
      operationId: logout
      summary: Web. Ferme la session
      responses:
        '204':
          description: Déconnecté

        '419': { $ref: '#/components/responses/CsrfInvalide' }
    servers: *id001

  /broadcasting/auth:
    servers: [{ url: / }]
    post:
      tags: [Comptes]
      operationId: broadcastingAuth
      summary: Web. Autorise l'écoute d'un canal privé Reverb (appelé par Laravel Echo)
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [socket_id, channel_name]
              properties:
                socket_id: { type: string }
                channel_name: { type: string, description: 'ex. private-deploiement.12' }
      responses:
        '200':
          description: Signature d'autorisation pour le canal
          content:
            application/json:
              schema:
                type: object
                required: [auth]
                properties:
                  auth: { type: string }
        '403': { $ref: '#/components/responses/Interdit' }

  /me:
    get:
      tags: [Comptes]
      operationId: getMe
      summary: Mon compte
      responses:
        '200':
          description: Mon compte
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Compte' }
        '401': { $ref: '#/components/responses/NonConnecte' }

  /devs/{username}:
    get:
      tags: [Comptes]
      operationId: getDev
      summary: Profil public (dépôts, étoiles, README)
      security: []
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Profil public
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfilDev' }
        '404': { $ref: '#/components/responses/Introuvable' }

  # ───────────── Applis ─────────────
  /apps:
    get:
      tags: [Applis]
      operationId: listApps
      summary: Le store
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/ParPage'
        - name: q
          in: query
          description: Recherche dans le nom et la description
          schema: { type: string, maxLength: 100 }
        - name: gratuit
          in: query
          description: true = uniquement les applis gratuites
          schema: { type: boolean }
        - name: techno
          in: query
          description: Uniquement les applis dont la stack contient cette techno
          schema: { $ref: '#/components/schemas/Techno' }
        - name: securite
          in: query
          description: true = uniquement les applis au badge « Security Checked » (statut verifie)
          schema: { type: boolean }
      responses:
        '200':
          description: Liste des applis
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagination'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/App' }
    post:
      tags: [Applis]
      operationId: createApp
      summary: Publier une appli (GitHub lié obligatoire ; soukdev.json validé immédiatement avec soukdev.schema.json ; captures envoyées dans le même formulaire ; refusée en 422 si un secret ou un docker-compose.yml dangereux est trouvé ; l'analyse des dépendances démarre ensuite)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/AppCreation' }
            encoding:
              captures: { contentType: 'image/png, image/jpeg, image/webp' }
      responses:
        '201':
          description: Appli publiée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/App' }
        '401': { $ref: '#/components/responses/NonConnecte' }
        '422': { $ref: '#/components/responses/Invalide' }
        '403': { description: 'GitHub non lié au compte (obligatoire pour publier)', content: { application/json: { schema: { $ref: '#/components/schemas/Erreur' } } } }
        '419': { $ref: '#/components/responses/CsrfInvalide' }

  /apps/verification:
    post:
      tags: [Applis]
      operationId: verifyAppRepo
      summary: Vérifier un dépôt avant de publier (dépôt public, docker-compose.yml, soukdev.json validé, aucun secret, docker-compose.yml sans réglage dangereux) ; ne publie rien
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [depot_url]
              properties:
                depot_url: { type: string, format: uri }
      responses:
        '200':
          description: Dépôt valide ; ce que la plateforme a lu dans soukdev.json
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationDepot' }
        '401': { $ref: '#/components/responses/NonConnecte' }
        '403': { description: 'GitHub non lié au compte', content: { application/json: { schema: { $ref: '#/components/schemas/Erreur' } } } }
        '422': { $ref: '#/components/responses/Invalide' }
        '429': { $ref: '#/components/responses/TropDeRequetes' }
        '419': { $ref: '#/components/responses/CsrfInvalide' }

  /apps/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Applis]
      operationId: getApp
      summary: Détail d'une appli (README, démo, prix, auteur)
      security: []
      responses:
        '200':
          description: L'appli
          content:
            application/json:
              schema: { $ref: '#/components/schemas/App' }
        '404': { $ref: '#/components/responses/Introuvable' }
    patch:
      tags: [Applis]
      operationId: updateApp
      summary: Modifier une appli (auteur uniquement)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppModification' }
      responses:
        '200':
          description: Appli modifiée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/App' }
        '403': { $ref: '#/components/responses/Interdit' }
        '404': { $ref: '#/components/responses/Introuvable' }
        '422': { $ref: '#/components/responses/Invalide' }
        '419': { $ref: '#/components/responses/CsrfInvalide' }
    delete:
      tags: [Applis]
      operationId: deleteApp
      summary: Retirer une appli (auteur uniquement)
      responses:
        '204':
          description: Appli retirée
        '403': { $ref: '#/components/responses/Interdit' }
        '404': { $ref: '#/components/responses/Introuvable' }
        '419': { $ref: '#/components/responses/CsrfInvalide' }

  /apps/{id}/captures:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Applis]
      operationId: replaceAppCaptures
      summary: Remplacer toutes les captures d'une appli (auteur uniquement ; POST car PHP ne lit pas le multipart en PATCH)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [captures]
              properties:
                captures: { $ref: '#/components/schemas/CapturesEnvoi' }
            encoding:
              captures: { contentType: 'image/png, image/jpeg, image/webp' }
      responses:
        '200':
          description: Captures remplacées
          content:
            application/json:
              schema: { $ref: '#/components/schemas/App' }
        '403': { $ref: '#/components/responses/Interdit' }
        '404': { $ref: '#/components/responses/Introuvable' }
        '422': { $ref: '#/components/responses/Invalide' }
        '419': { $ref: '#/components/responses/CsrfInvalide' }

  /apps/{id}/securite:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Applis]
      operationId: rescanAppSecurity
      summary: Relancer l'analyse de sécurité (auteur uniquement), par exemple après avoir corrigé une dépendance
      responses:
        '202':
          description: Analyse mise en file ; le statut passe à en_cours
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Securite' }
        '403': { $ref: '#/components/responses/Interdit' }
        '404': { $ref: '#/components/responses/Introuvable' }
        '429': { $ref: '#/components/responses/TropDeRequetes' }
        '419': { $ref: '#/components/responses/CsrfInvalide' }

  /technos:
    get:
      tags: [Applis]
      operationId: listTechnos
      summary: Liste fixe des technos (stack d'une appli, filtre du store)
      security: []
      responses:
        '200':
          description: Les technos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Techno' }

  # ───────────── Déploiements ─────────────
  /apps/{id}/deployments:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Déploiements]
      operationId: createDeployment
      summary: "Lancer un déploiement client (répond tout de suite avec l'état en_file). Paiement du serveur : mécanisme en attente (voir DECISIONS.md)."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeploiementCreation' }
      responses:
        '202':
          description: Déploiement mis en file ; les changements d'état arrivent par Reverb
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deploiement' }
        '401': { $ref: '#/components/responses/NonConnecte' }
        '404': { $ref: '#/components/responses/Introuvable' }
        '422': { $ref: '#/components/responses/Invalide' }
        '429': { $ref: '#/components/responses/TropDeRequetes' }
        '419': { $ref: '#/components/responses/CsrfInvalide' }

  /deployments:
    get:
      tags: [Déploiements]
      operationId: listDeployments
      summary: Mes déploiements
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/ParPage'
      responses:
        '200':
          description: Liste de mes déploiements
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagination'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Deploiement' }
        '401': { $ref: '#/components/responses/NonConnecte' }

  /deployments/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Déploiements]
      operationId: getDeployment
      summary: État et URL d'un déploiement
      responses:
        '200':
          description: Le déploiement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deploiement' }
        '403': { $ref: '#/components/responses/Interdit' }
        '404': { $ref: '#/components/responses/Introuvable' }
    delete:
      tags: [Déploiements]
      operationId: deleteDeployment
      summary: Arrêter un déploiement
      responses:
        '204':
          description: Déploiement arrêté
        '403': { $ref: '#/components/responses/Interdit' }
        '404': { $ref: '#/components/responses/Introuvable' }
        '419': { $ref: '#/components/responses/CsrfInvalide' }

  # ───────────── Discussions ─────────────
  /discussions:
    get:
      tags: [Discussions]
      operationId: listDiscussions
      summary: Le fil (filtrable par appli, canal ou étiquette)
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/ParPage'
        - name: app
          in: query
          schema: { type: integer }
        - name: canal
          in: query
          schema: { type: string }
        - name: etiquette
          in: query
          schema: { $ref: '#/components/schemas/Etiquette' }
        - name: statut
          in: query
          description: Sans ce filtre, toutes les discussions
          schema: { type: string, enum: [ouvertes, resolues] }
      responses:
        '200':
          description: Liste des discussions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagination'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Discussion' }
    post:
      tags: [Discussions]
      operationId: createDiscussion
      summary: Poster une discussion (appli jointe en option)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiscussionCreation' }
      responses:
        '201':
          description: Discussion créée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Discussion' }
        '401': { $ref: '#/components/responses/NonConnecte' }
        '422': { $ref: '#/components/responses/Invalide' }
        '429': { $ref: '#/components/responses/TropDeRequetes' }
        '419': { $ref: '#/components/responses/CsrfInvalide' }

  /discussions/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Discussions]
      operationId: getDiscussion
      summary: 'Une discussion (ses messages : GET /discussions/{id}/messages)'
      security: []
      responses:
        '200':
          description: La discussion
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Discussion' }
        '404': { $ref: '#/components/responses/Introuvable' }
    patch:
      tags: [Discussions]
      operationId: updateDiscussion
      summary: Modifier sa discussion (auteur uniquement)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiscussionModification' }
      responses:
        '200':
          description: Discussion modifiée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Discussion' }
        '403': { $ref: '#/components/responses/Interdit' }
        '404': { $ref: '#/components/responses/Introuvable' }
        '422': { $ref: '#/components/responses/Invalide' }
        '419': { $ref: '#/components/responses/CsrfInvalide' }
    delete:
      tags: [Discussions]
      operationId: deleteDiscussion
      summary: Supprimer une discussion (auteur ou admin)
      responses:
        '204':
          description: Discussion supprimée
        '403': { $ref: '#/components/responses/Interdit' }
        '404': { $ref: '#/components/responses/Introuvable' }
        '419': { $ref: '#/components/responses/CsrfInvalide' }

  /discussions/{id}/messages:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Discussions]
      operationId: listMessages
      summary: Messages d'une discussion, du plus ancien au plus récent
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/ParPage'
      responses:
        '200':
          description: Liste des messages
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagination'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Message' }
        '404': { $ref: '#/components/responses/Introuvable' }
    post:
      tags: [Discussions]
      operationId: createMessage
      summary: Répondre dans une discussion
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MessageCreation' }
      responses:
        '201':
          description: Message publié (diffusé par Reverb)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '401': { $ref: '#/components/responses/NonConnecte' }
        '404': { $ref: '#/components/responses/Introuvable' }
        '422': { $ref: '#/components/responses/Invalide' }
        '419': { $ref: '#/components/responses/CsrfInvalide' }

  /discussions/{id}/copie-test:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Discussions]
      operationId: createCopieTest
      summary: Lancer une copie de test, sur demande explicite de l'auteur (à partir du depot_url ou de l'appli jointe ; soukdev.json requis)
      responses:
        '202':
          description: Copie de test mise en file ; son état arrive par Reverb
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deploiement' }
        '403': { $ref: '#/components/responses/Interdit' }
        '404': { $ref: '#/components/responses/Introuvable' }
        '409': { $ref: '#/components/responses/Conflit' }
        '422': { $ref: '#/components/responses/Invalide' }
        '429': { $ref: '#/components/responses/TropDeRequetes' }
        '419': { $ref: '#/components/responses/CsrfInvalide' }

  /messages/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Discussions]
      operationId: updateMessage
      summary: Modifier son message (auteur uniquement)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MessageCreation' }
      responses:
        '200':
          description: Message modifié
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '403': { $ref: '#/components/responses/Interdit' }
        '404': { $ref: '#/components/responses/Introuvable' }
        '422': { $ref: '#/components/responses/Invalide' }
        '419': { $ref: '#/components/responses/CsrfInvalide' }
    delete:
      tags: [Discussions]
      operationId: deleteMessage
      summary: Supprimer un message (auteur ou admin)
      responses:
        '204':
          description: Message supprimé
        '403': { $ref: '#/components/responses/Interdit' }
        '404': { $ref: '#/components/responses/Introuvable' }
        '419': { $ref: '#/components/responses/CsrfInvalide' }

  /canaux:
    get:
      tags: [Discussions]
      operationId: listCanaux
      summary: Liste des canaux
      security: []
      responses:
        '200':
          description: Liste des canaux
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Canal' }
    post:
      tags: [Discussions]
      operationId: createCanal
      summary: Créer un canal
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CanalCreation' }
      responses:
        '201':
          description: Canal créé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Canal' }
        '401': { $ref: '#/components/responses/NonConnecte' }
        '422': { $ref: '#/components/responses/Invalide' }
        '419': { $ref: '#/components/responses/CsrfInvalide' }

  /etiquettes:
    get:
      tags: [Discussions]
      operationId: listEtiquettes
      summary: Liste fixe des étiquettes de sujet
      security: []
      responses:
        '200':
          description: Les étiquettes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Etiquette' }

  # ───────────── Correctifs ─────────────
  /discussions/{id}/correctifs:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Correctifs]
      operationId: listCorrectifs
      summary: Correctifs proposés pour une discussion
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/ParPage'
      responses:
        '200':
          description: Liste des correctifs
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagination'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Correctif' }
        '404': { $ref: '#/components/responses/Introuvable' }
    post:
      tags: [Correctifs]
      operationId: createCorrectif
      summary: "Proposer un correctif : URL d'une branche ou d'un fork GitHub (GitHub lié obligatoire). Aucun déploiement automatique."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CorrectifCreation' }
      responses:
        '201':
          description: Correctif proposé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Correctif' }
        '401': { $ref: '#/components/responses/NonConnecte' }
        '404': { $ref: '#/components/responses/Introuvable' }
        '422': { $ref: '#/components/responses/Invalide' }
        '403': { description: 'GitHub non lié au compte', content: { application/json: { schema: { $ref: '#/components/schemas/Erreur' } } } }
        '429': { $ref: '#/components/responses/TropDeRequetes' }
        '419': { $ref: '#/components/responses/CsrfInvalide' }

  /correctifs/{id}/accepter:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Correctifs]
      operationId: acceptCorrectif
      summary: Accepter un correctif (auteur de la discussion ; un seul accepté par discussion ; marque la discussion résolue ; ne fusionne rien sur GitHub)
      responses:
        '200':
          description: Correctif accepté
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Correctif' }
        '403': { $ref: '#/components/responses/Interdit' }
        '404': { $ref: '#/components/responses/Introuvable' }
        '409': { $ref: '#/components/responses/Conflit' }
        '419': { $ref: '#/components/responses/CsrfInvalide' }

  /correctifs/{id}/deploiement:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Correctifs]
      operationId: deployCorrectif
      summary: Optionnel. Déployer sa version corrigée pour la montrer tourner (auteur du correctif ; soukdev.json requis)
      responses:
        '202':
          description: Déploiement mis en file ; son état arrive par Reverb
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deploiement' }
        '403': { $ref: '#/components/responses/Interdit' }
        '404': { $ref: '#/components/responses/Introuvable' }
        '409': { $ref: '#/components/responses/Conflit' }
        '422': { $ref: '#/components/responses/Invalide' }
        '429': { $ref: '#/components/responses/TropDeRequetes' }
        '419': { $ref: '#/components/responses/CsrfInvalide' }

  # ───────────── Missions ─────────────
  /apps/{id}/missions:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Missions]
      operationId: createMission
      summary: Demander une version sur mesure à l'auteur de l'appli (privé, sans enchères)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MissionCreation' }
      responses:
        '201':
          description: Demande envoyée à l'auteur
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Mission' }
        '401': { $ref: '#/components/responses/NonConnecte' }
        '404': { $ref: '#/components/responses/Introuvable' }
        '422': { $ref: '#/components/responses/Invalide' }
        '429': { $ref: '#/components/responses/TropDeRequetes' }
        '419': { $ref: '#/components/responses/CsrfInvalide' }

  /missions:
    get:
      tags: [Missions]
      operationId: listMissions
      summary: Mes missions, comme client ou comme auteur
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/ParPage'
      responses:
        '200':
          description: Liste de mes missions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagination'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Mission' }
        '401': { $ref: '#/components/responses/NonConnecte' }

  /missions/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Missions]
      operationId: getMission
      summary: Une mission (client ou auteur uniquement)
      responses:
        '200':
          description: La mission
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Mission' }
        '403': { $ref: '#/components/responses/Interdit' }
        '404': { $ref: '#/components/responses/Introuvable' }

  /missions/{id}/messages:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Missions]
      operationId: listMissionMessages
      summary: Fil privé de la mission (client ou auteur uniquement)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/ParPage'
      responses:
        '200':
          description: Liste des messages
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagination'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Message' }
        '403': { $ref: '#/components/responses/Interdit' }
        '404': { $ref: '#/components/responses/Introuvable' }
    post:
      tags: [Missions]
      operationId: createMissionMessage
      summary: Écrire dans le fil privé de la mission
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MessageCreation' }
      responses:
        '201':
          description: Message publié (diffusé sur le canal privé mission.{id})
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '403': { $ref: '#/components/responses/Interdit' }
        '404': { $ref: '#/components/responses/Introuvable' }
        '422': { $ref: '#/components/responses/Invalide' }
        '419': { $ref: '#/components/responses/CsrfInvalide' }

  # ───────────── Événements ─────────────
  /events:
    get:
      tags: [Événements]
      operationId: listEvents
      summary: Liste des événements
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/ParPage'
      responses:
        '200':
          description: Liste des événements
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagination'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Evenement' }
    post:
      tags: [Événements]
      operationId: createEvent
      summary: Créer un événement
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EvenementCreation' }
      responses:
        '201':
          description: Événement créé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Evenement' }
        '401': { $ref: '#/components/responses/NonConnecte' }
        '422': { $ref: '#/components/responses/Invalide' }
        '419': { $ref: '#/components/responses/CsrfInvalide' }

  /events/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Événements]
      operationId: getEvent
      summary: Détail d'un événement (lien en ligne visible par les inscrits uniquement)
      security: []
      responses:
        '200':
          description: L'événement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Evenement' }
        '404': { $ref: '#/components/responses/Introuvable' }
    patch:
      tags: [Événements]
      operationId: updateEvent
      summary: Modifier un événement (organisateur uniquement)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EvenementModification' }
      responses:
        '200':
          description: Événement modifié
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Evenement' }
        '403': { $ref: '#/components/responses/Interdit' }
        '404': { $ref: '#/components/responses/Introuvable' }
        '422': { $ref: '#/components/responses/Invalide' }
        '419': { $ref: '#/components/responses/CsrfInvalide' }
    delete:
      tags: [Événements]
      operationId: deleteEvent
      summary: Supprimer un événement (organisateur ou admin) ; les inscrits sont prévenus
      responses:
        '204':
          description: Événement supprimé
        '403': { $ref: '#/components/responses/Interdit' }
        '404': { $ref: '#/components/responses/Introuvable' }
        '419': { $ref: '#/components/responses/CsrfInvalide' }

  /events/{id}/inscription:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Événements]
      operationId: registerEvent
      summary: S'inscrire
      responses:
        '204':
          description: Inscrit
        '401': { $ref: '#/components/responses/NonConnecte' }
        '404': { $ref: '#/components/responses/Introuvable' }
        '409': { $ref: '#/components/responses/Conflit' }
        '419': { $ref: '#/components/responses/CsrfInvalide' }
    delete:
      tags: [Événements]
      operationId: unregisterEvent
      summary: Se désinscrire
      responses:
        '204':
          description: Désinscrit
        '401': { $ref: '#/components/responses/NonConnecte' }
        '404': { $ref: '#/components/responses/Introuvable' }
        '419': { $ref: '#/components/responses/CsrfInvalide' }

  /events/{id}/participants:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Événements]
      operationId: listParticipants
      summary: Liste des participants (inscrits et organisateur uniquement ; le nombre d'inscrits est public)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/ParPage'
      responses:
        '200':
          description: Liste des participants
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagination'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Dev' }
        '404': { $ref: '#/components/responses/Introuvable' }
        '403': { $ref: '#/components/responses/Interdit' }

  /events/{id}/avis:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Événements]
      operationId: listAvis
      summary: Avis laissés sur un événement
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/ParPage'
      responses:
        '200':
          description: Liste des avis
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagination'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Avis' }
        '404': { $ref: '#/components/responses/Introuvable' }
    post:
      tags: [Événements]
      operationId: createAvis
      summary: Laisser un avis (inscrit uniquement, après la date, un seul par dev)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AvisCreation' }
      responses:
        '201':
          description: Avis publié
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Avis' }
        '401': { $ref: '#/components/responses/NonConnecte' }
        '403': { $ref: '#/components/responses/Interdit' }
        '404': { $ref: '#/components/responses/Introuvable' }
        '422': { $ref: '#/components/responses/Invalide' }
        '409': { $ref: '#/components/responses/Conflit' }
        '419': { $ref: '#/components/responses/CsrfInvalide' }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: soukdev_session
      description: 'Session Laravel Sanctum (SPA), cookie fixé par SESSION_COOKIE. Requêtes POST, PATCH et DELETE : en-tête X-XSRF-TOKEN obligatoire.'

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer }

    Page:
      name: page
      in: query
      description: Numéro de page (commence à 1)
      schema: { type: integer, minimum: 1, default: 1 }

    ParPage:
      name: per_page
      in: query
      description: Éléments par page (50 maximum)
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }

  responses:
    NonConnecte:
      description: Non connecté
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erreur' }

    Interdit:
      description: Action non autorisée
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erreur' }

    Introuvable:
      description: Ressource introuvable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erreur' }

    Invalide:
      description: Données invalides (ex. soukdev.json invalide)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErreurValidation' }

    Conflit:
      description: Doublon ou état incompatible (ex. deuxième avis, deuxième inscription, correctif déjà accepté)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erreur' }

    CsrfInvalide:
      description: Jeton CSRF absent ou expiré (appeler GET /sanctum/csrf-cookie)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erreur' }

    TropDeRequetes:
      description: Limite de débit atteinte
      headers:
        Retry-After:
          description: Secondes à attendre avant de réessayer
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erreur' }

  schemas:
    Erreur:
      type: object
      required: [message]
      properties:
        message: { type: string }

    ErreurValidation:
      type: object
      required: [message, errors]
      properties:
        message: { type: string }
        errors:
          type: object
          description: Erreurs par champ (format de validation Laravel)
          additionalProperties:
            type: array
            items: { type: string }

    Pagination:
      type: object
      description: Format de pagination des API Resources Laravel ; la liste est dans data
      required: [links, meta]
      properties:
        links:
          type: object
          required: [first, last, prev, next]
          properties:
            first: { type: [string, 'null'], format: uri }
            last: { type: [string, 'null'], format: uri }
            prev: { type: [string, 'null'], format: uri }
            next: { type: [string, 'null'], format: uri }
        meta:
          type: object
          required: [current_page, last_page, per_page, total]
          properties:
            current_page: { type: integer }
            last_page: { type: integer }
            per_page: { type: integer }
            total: { type: integer }

    # ───────────── Comptes ─────────────
    Dev:
      type: object
      description: Un compte tel qu'il apparaît publiquement (auteur, participant, client d'une mission…)
      required: [id, nom, username, avatar_url, github_url, profil]
      properties:
        id: { type: integer }
        nom: { type: [string, 'null'] }
        username: { type: [string, 'null'], description: 'Identifiant GitHub ; null si GitHub non lié' }
        avatar_url: { type: [string, 'null'], format: uri }
        github_url: { type: [string, 'null'], format: uri }
        profil:
          type: string
          enum: [dev, client]
          description: Choix d'entrée, sert à la redirection ; pas une étiquette définitive

    Compte:
      description: Mon compte (GET /me)
      allOf:
        - $ref: '#/components/schemas/Dev'
        - type: object
          required: [email, github_lie, est_admin]
          properties:
            email: { type: [string, 'null'], format: email }
            github_lie: { type: boolean, description: Obligatoire pour publier une appli ou proposer un correctif }
            est_admin: { type: boolean }

    LienMagiqueDemande:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }

    ProfilDev:
      description: Profil public d'un dev, avec ses dépôts publics GitHub et ses applis publiées
      allOf:
        - $ref: '#/components/schemas/Dev'
        - type: object
          required: [depots, applis]
          properties:
            bio: { type: [string, 'null'] }
            depots:
              type: array
              items: { $ref: '#/components/schemas/Depot' }
            applis:
              type: array
              items: { $ref: '#/components/schemas/App' }

    Depot:
      type: object
      description: Dépôt public GitHub du dev
      required: [nom, url, etoiles]
      properties:
        nom: { type: string }
        description: { type: [string, 'null'] }
        url: { type: string, format: uri }
        etoiles: { type: integer }
        langage: { type: [string, 'null'] }
        readme: { type: [string, 'null'], description: README en Markdown }

    # ───────────── Applis ─────────────
    App:
      type: object
      required: [id, nom, description, prix, type_prix, demo_url, depot_url, captures, stack, backend, variables_client, securite, auteur, cree_le]
      properties:
        id: { type: integer }
        nom: { type: string }
        description: { type: string }
        readme: { type: [string, 'null'], description: README du dépôt en Markdown }
        prix: { type: integer, minimum: 0, description: Prix de l'appli en FCFA, par mois ou une seule fois selon type_prix ; 0 = gratuit }
        type_prix: { $ref: '#/components/schemas/TypePrix' }
        demo_url: { type: string, format: uri }
        depot_url: { type: string, format: uri }
        captures:
          type: array
          description: Captures d'écran ; la première sert de couverture sur la carte du store
          minItems: 1
          maxItems: 5
          items: { $ref: '#/components/schemas/Capture' }
        stack:
          type: array
          minItems: 1
          maxItems: 8
          uniqueItems: true
          items: { $ref: '#/components/schemas/Techno' }
        backend:
          type: string
          enum: [propre, integre]
          description: Type de backend déclaré dans soukdev.json
        variables_client:
          type: array
          description: Variables que le client remplit au déploiement (déclarées dans soukdev.json)
          items: { $ref: '#/components/schemas/VariableClient' }
        securite: { $ref: '#/components/schemas/Securite' }
        auteur: { $ref: '#/components/schemas/Dev' }
        cree_le: { type: string, format: date-time }

    VariableClient:
      type: object
      required: [nom, libelle, requis]
      properties:
        nom: { type: string, description: 'Nom de la variable, ex. PHARMACIE_NOM' }
        libelle: { type: string, description: 'Texte affiché au client, ex. « Nom de la pharmacie »' }
        requis: { type: boolean }

    AppCreation:
      type: object
      description: Envoyé en multipart/form-data (champs texte + images)
      required: [nom, description, depot_url, demo_url, prix, type_prix, stack, captures]
      properties:
        nom: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 1000 }
        depot_url: { type: string, format: uri, description: Dépôt GitHub public contenant docker-compose.yml et soukdev.json }
        demo_url: { type: string, format: uri }
        prix: { type: integer, minimum: 0 }
        type_prix: { $ref: '#/components/schemas/TypePrix' }
        stack:
          type: array
          minItems: 1
          maxItems: 8
          uniqueItems: true
          items: { $ref: '#/components/schemas/Techno' }
        captures: { $ref: '#/components/schemas/CapturesEnvoi' }

    TypePrix:
      type: string
      enum: [mensuel, unique]
      description: "mensuel = le client paie le prix chaque mois ; unique = il le paie une seule fois. L'hébergement reste mensuel dans les deux cas. Ignoré quand prix vaut 0."

    Securite:
      type: object
      description: "Analyse des dépendances du dépôt (Trivy). Secrets et docker-compose.yml dangereux bloquent la publication et n'apparaissent donc jamais ici."
      required: [statut, analyse_le, problemes]
      properties:
        statut:
          type: string
          enum: [en_cours, verifie, problemes]
          description: "verifie = badge vert « Security Checked » ; problemes = badge orange « Problèmes détectés »"
        analyse_le: { type: [string, 'null'], format: date-time, description: null tant que la première analyse n'est pas finie }
        problemes:
          type: array
          items: { $ref: '#/components/schemas/ProblemeSecurite' }

    ProblemeSecurite:
      type: object
      description: Une dépendance avec une faille connue
      required: [identifiant, paquet, version, gravite, version_corrigee]
      properties:
        identifiant: { type: string, description: 'Référence publique de la faille, ex. CVE-2024-12345' }
        paquet: { type: string, description: 'ex. laravel/framework' }
        version: { type: string, description: Version utilisée par le dépôt }
        gravite: { type: string, enum: [faible, moyenne, haute, critique] }
        version_corrigee: { type: [string, 'null'], description: Première version sans la faille, si elle existe }

    VerificationDepot:
      type: object
      description: "Dépôt valide. En cas d'erreur (dépôt privé ou introuvable, docker-compose.yml absent, soukdev.json invalide, secret trouvé dans le dépôt, docker-compose.yml dangereux : privileged, volumes de l'hôte, network_mode host, ports publiés), réponse 422 avec le détail par champ."
      required: [service_web, backend, variables_client]
      properties:
        service_web:
          type: object
          required: [nom, port]
          properties:
            nom: { type: string }
            port: { type: integer }
        backend: { type: string, enum: [propre, integre] }
        variables_client:
          type: array
          items: { $ref: '#/components/schemas/VariableClient' }

    CapturesEnvoi:
      type: array
      description: 1 à 5 images PNG, JPEG ou WebP, 5 Mo maximum chacune ; la première sert de couverture
      minItems: 1
      maxItems: 5
      items: { type: string, format: binary, contentMediaType: application/octet-stream }

    Capture:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri }

    Techno:
      type: string
      description: Liste fixe ; « autre » pour une techno absente de la liste
      enum: [laravel, symfony, php, node, express, nestjs, nextjs, react, vue, angular, svelte, django, flask, fastapi, spring, dotnet, go, postgresql, mysql, mongodb, redis, autre]

    AppModification:
      type: object
      description: Tous les champs sont optionnels ; seuls ceux envoyés sont modifiés
      properties:
        nom: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 1000 }
        demo_url: { type: string, format: uri }
        prix: { type: integer, minimum: 0 }
        type_prix: { $ref: '#/components/schemas/TypePrix' }
        stack:
          type: array
          minItems: 1
          maxItems: 8
          uniqueItems: true
          items: { $ref: '#/components/schemas/Techno' }

    # ───────────── Déploiements ─────────────
    Deploiement:
      type: object
      required: [id, app_id, type, etat, url, erreur, cree_le]
      properties:
        id: { type: integer }
        app_id: { type: integer }
        type:
          type: string
          enum: [client, test, correctif]
          description: Copie d'un client, copie de test d'une discussion, ou version corrigée
        etat:
          type: string
          enum: [en_file, construction, demarrage, en_ligne, echec, arrete]
        url:
          type: [string, 'null']
          format: uri
          description: Renseignée quand l'état est en_ligne
        erreur:
          type: [string, 'null']
          description: Message lisible quand l'état est echec
        cree_le: { type: string, format: date-time }

    DeploiementCreation:
      type: object
      required: [variables]
      properties:
        variables:
          type: object
          description: 'Valeurs des variables_client de l''appli, ex. {"PHARMACIE_NOM": "Pharmacie du Port"}'
          additionalProperties: { type: string }

    # ───────────── Discussions ─────────────
    Etiquette:
      type: string
      enum: [bug, question, tuto, projet, entraide]

    Discussion:
      type: object
      required: [id, titre, texte, auteur, canal, app_id, depot_url, demo_url, etiquettes, copie_test, resolue, nb_messages, cree_le]
      properties:
        id: { type: integer }
        titre: { type: string }
        texte: { type: string, description: Markdown }
        auteur: { $ref: '#/components/schemas/Dev' }
        canal: { type: [string, 'null'], description: Slug du canal }
        app_id: { type: [integer, 'null'], description: Appli jointe }
        depot_url: { type: [string, 'null'], format: uri, description: Dépôt GitHub public joint (même non publié) }
        demo_url: { type: [string, 'null'], format: uri, description: 'Appli déployée ailleurs (ex. Vercel), affichée dans une iframe sandbox' }
        etiquettes: { type: array, items: { $ref: '#/components/schemas/Etiquette' } }
        copie_test:
          description: Copie de test, seulement si l'auteur l'a lancée (POST /discussions/{id}/copie-test)
          oneOf:
            - $ref: '#/components/schemas/Deploiement'
            - type: 'null'
        resolue: { type: boolean, description: "Vraie quand l'auteur accepte un correctif ou la marque résolue lui-même (PATCH)" }
        nb_messages: { type: integer }
        cree_le: { type: string, format: date-time }
      description: Une discussion est soit dans un canal, soit sur la page d'une appli, jamais les deux.

    DiscussionCreation:
      type: object
      description: Il faut soit canal, soit app_id (jamais les deux). depot_url et demo_url sont optionnels et ne lancent aucun déploiement.
      required: [titre, texte]
      properties:
        titre: { type: string, maxLength: 200 }
        texte: { type: string }
        canal: { type: string, description: Slug du canal ; obligatoire sans app_id }
        app_id: { type: integer, description: Appli publiée ; exclut canal }
        depot_url: { type: string, format: uri }
        demo_url: { type: string, format: uri }
        etiquettes:
          type: array
          items: { $ref: '#/components/schemas/Etiquette' }
      oneOf:
        - required: [canal]
          not: { required: [app_id] }
        - required: [app_id]
          not: { required: [canal] }

    DiscussionModification:
      type: object
      description: Tous les champs sont optionnels ; seuls ceux envoyés sont modifiés
      properties:
        titre: { type: string, maxLength: 200 }
        texte: { type: string }
        depot_url: { type: [string, 'null'], format: uri }
        demo_url: { type: [string, 'null'], format: uri }
        etiquettes:
          type: array
          items: { $ref: '#/components/schemas/Etiquette' }
        resolue: { type: boolean, description: "L'auteur la marque résolue (même sans correctif) ou la rouvre" }

    Message:
      type: object
      required: [id, texte, auteur, cree_le]
      properties:
        id: { type: integer }
        texte: { type: string, description: Markdown }
        auteur: { $ref: '#/components/schemas/Dev' }
        cree_le: { type: string, format: date-time }

    MessageCreation:
      type: object
      required: [texte]
      properties:
        texte: { type: string }

    Canal:
      type: object
      required: [slug, nom, description]
      properties:
        slug: { type: string, description: 'ex. laravel, mobile-money' }
        nom: { type: string }
        description: { type: [string, 'null'] }

    CanalCreation:
      type: object
      required: [nom]
      properties:
        nom: { type: string, maxLength: 50 }
        description: { type: string, maxLength: 300 }

    # ───────────── Correctifs ─────────────
    Correctif:
      type: object
      required: [id, discussion_id, depot_url, demo_url, description, accepte, deploiement, auteur, cree_le]
      properties:
        id: { type: integer }
        discussion_id: { type: integer }
        depot_url: { type: string, format: uri, description: Fork ou branche GitHub }
        demo_url: { type: [string, 'null'], format: uri, description: Version corrigée déployée ailleurs (optionnel) }
        description: { type: [string, 'null'], description: Ce que le correctif change }
        accepte: { type: boolean }
        deploiement: { description: 'Déploiement de la version corrigée, seulement si son auteur l''a lancé', oneOf: [$ref: '#/components/schemas/Deploiement', type: 'null'] }
        auteur: { $ref: '#/components/schemas/Dev' }
        cree_le: { type: string, format: date-time }

    CorrectifCreation:
      type: object
      required: [depot_url]
      properties:
        depot_url: { type: string, format: uri, description: URL d'une branche ou d'un fork GitHub }
        description: { type: string, maxLength: 1000 }
        demo_url: { type: string, format: uri }

    # ───────────── Missions ─────────────
    Mission:
      type: object
      description: Demande privée d'un client à l'auteur d'une appli ; visible par eux seuls
      required: [id, app_id, client, auteur, message, budget, delai, cree_le]
      properties:
        id: { type: integer }
        app_id: { type: integer }
        client: { $ref: '#/components/schemas/Dev' }
        auteur: { $ref: '#/components/schemas/Dev' }
        message: { type: string, description: Besoin exprimé par le client }
        budget: { type: [integer, 'null'], minimum: 0, description: Budget indicatif en FCFA }
        delai: { type: [string, 'null'], format: date, description: Date souhaitée }
        cree_le: { type: string, format: date-time }

    MissionCreation:
      type: object
      required: [message]
      properties:
        message: { type: string, maxLength: 5000 }
        budget: { type: integer, minimum: 0 }
        delai: { type: string, format: date }

    # ───────────── Événements ─────────────
    Evenement:
      type: object
      required: [id, titre, description, date, type, lieu, lien, organisateur, nb_inscrits, inscrit, note_moyenne]
      properties:
        id: { type: integer }
        titre: { type: string }
        description: { type: string }
        date: { type: string, format: date-time }
        type:
          type: string
          enum: [en_ligne, presentiel]
        lieu: { type: [string, 'null'], description: Renseigné si presentiel }
        lien:
          type: [string, 'null']
          format: uri
          description: Renseigné si en_ligne ; null si le dev connecté n'est pas inscrit
        organisateur: { $ref: '#/components/schemas/Dev' }
        nb_inscrits: { type: integer, description: Public }
        inscrit: { type: boolean, description: 'Le dev connecté est-il inscrit ?' }
        note_moyenne: { type: [number, 'null'], description: null tant qu'il n'y a aucun avis }

    EvenementCreation:
      type: object
      description: lieu est obligatoire si type = presentiel, lien est obligatoire si type = en_ligne
      required: [titre, description, date, type]
      properties:
        titre: { type: string, maxLength: 200 }
        description: { type: string }
        date: { type: string, format: date-time }
        type:
          type: string
          enum: [en_ligne, presentiel]
        lieu: { type: string }
        lien: { type: string, format: uri }

    EvenementModification:
      type: object
      description: Tous les champs sont optionnels ; seuls ceux envoyés sont modifiés
      properties:
        titre: { type: string, maxLength: 200 }
        description: { type: string }
        date: { type: string, format: date-time }
        type:
          type: string
          enum: [en_ligne, presentiel]
        lieu: { type: string }
        lien: { type: string, format: uri }

    Avis:
      type: object
      required: [id, note, commentaire, auteur, cree_le]
      properties:
        id: { type: integer }
        note: { type: integer, minimum: 1, maximum: 5 }
        commentaire: { type: [string, 'null'] }
        auteur: { $ref: '#/components/schemas/Dev' }
        cree_le: { type: string, format: date-time }

    AvisCreation:
      type: object
      required: [note]
      properties:
        note: { type: integer, minimum: 1, maximum: 5 }
        commentaire: { type: string, maxLength: 1000 }
