# Configuration statique de Traefik en production (docker-compose.prod.yml).
# HTTPS partout : la plateforme (front, API, Reverb) et les copies, certificats Let's Encrypt.
# Pas de fournisseur Docker : les labels des dépôts et des images ne sont jamais lus.
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
    http:
      tls:
        certResolver: letsencrypt
  # Contrôle de santé (traefik healthcheck --ping), seulement sur la boucle locale.
  ping:
    address: "127.0.0.1:8082"

ping:
  entryPoint: ping

# Le compte Let's Encrypt (e-mail, stockage, défi HTTP) est passé en arguments dans
# docker-compose.prod.yml : ce fichier statique n'interpole pas les variables d'environnement.
# Un certificat joker (*.domaine) exigerait le défi DNS-01 : voir docs/exploitation.md.

providers:
  file:
    # Un fichier par copie en ligne (écrit par App\Moteur\RouteurCopies), plus plateforme.yml
    # (écrit au démarrage par le service « init » depuis plateforme.yml.dist, avec le domaine).
    directory: /routes
    watch: true

api:
  dashboard: false

# Journaux JSON sur la sortie standard : le VPS les collecte tels quels.
log:
  level: INFO
  format: json

accessLog:
  format: json
