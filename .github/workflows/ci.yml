name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - name: Installer PHP et Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - name: Installer les dépendances
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Préparer l'environnement
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Style (Laravel Pint)
        run: vendor/bin/pint --test
      - name: Tests (PHPUnit)
        run: php artisan test
      - name: Licences (GPL, AGPL, LGPL interdites)
        run: composer check-licenses

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - name: Installer Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installer les dépendances
        run: npm ci
      - name: Lint (ESLint)
        run: npm run lint
      - name: Tests (Vitest)
        run: npm test
      - name: Build (TypeScript + Vite)
        run: npm run build
      - name: Licences (GPL, AGPL, LGPL interdites)
        run: npm run check-licenses
