; Réglages PHP de la plateforme Souk.dev.
expose_php = Off
memory_limit = 512M

; Captures : 5 images de 5 Mo au plus, plus les champs du formulaire.
upload_max_filesize = 6M
post_max_size = 32M

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
